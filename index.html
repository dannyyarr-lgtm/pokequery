const ZONES=[{id:'start',name:'Starter Station',icon:'🚀',desc:'Read your first query',from:0,to:4},{id:'filter',name:'Filter Forest',icon:'🔎',desc:'Find the right rows',from:4,to:8},{id:'aggregate',name:'Aggregation Arcade',icon:'🧮',desc:'Turn rows into KPIs',from:8,to:12},{id:'join',name:'Join Junction',icon:'🔗',desc:'Connect your data',from:12,to:15},{id:'analyst',name:'Analyst Outpost',icon:'📈',desc:'Answer business questions',from:15,to:21},{id:'pro',name:'Data Quality Dungeon',icon:'🧹',desc:'Clean and challenge data',from:21,to:23},{id:'boss',name:'Boardroom Boss Fight',icon:'🏆',desc:'Solve the commercial brief',from:23,to:26},{id:'model',name:'Data Model Citadel',icon:'🏗️',desc:'Grain, keys, joins and trustworthy metrics',from:26,to:30},{id:'commercial',name:'Commercial Intelligence',icon:'💷',desc:'Targets, pricing, stock cover and competitor gaps',from:30,to:34},{id:'advanced',name:'Advanced SQL Lab',icon:'🧠',desc:'Subqueries, CTE thinking, ranking and trends',from:34,to:38},{id:'quality',name:'Trust & Governance Vault',icon:'🛡️',desc:'Reconciliation, lineage, privacy and data quality',from:38,to:42},{id:'production',name:'Production Control Room',icon:'⚙️',desc:'Reliability, performance and operational SQL',from:42,to:46},{id:'leader',name:'Analytics Leadership Arena',icon:'🎖️',desc:'Defend decisions, trade-offs and a technical roadmap',from:46,to:50},{id:'executive',name:'Executive Analytics Practicum',icon:'🧭',desc:'Targets, cohorts, ranking and stakeholder defence',from:50,to:56}];
const MISSIONS=[
{title:'Your first SELECT',zone:0,concept:'SELECT chooses which columns to show. FROM names the table to read.',ex:'SELECT name, price FROM products;',task:'Show the name and price of every product.',hint:['Start with SELECT, followed by the two requested column names.','Read the rows from the products table.'],solution:'SELECT name, price FROM products;',why:'You selected only the columns needed for the question. Avoid SELECT * in a report when you know exactly what you need.',skill:'select'},
{title:'Read the catalogue',zone:0,concept:'SELECT * returns every column. It is useful for exploring a table, but less tidy for final reporting.',ex:'SELECT * FROM stores LIMIT 5;',task:'Show all columns for every store.',hint:['Use the wildcard * after SELECT.','The table is stores.'],solution:'SELECT * FROM stores;',why:'SELECT * is handy while exploring a new schema. In production, choose explicit columns so the output stays stable.',skill:'select'},
{title:'Filter by price',zone:0,concept:'WHERE filters individual rows before the result is returned. Text values use single quotes.',ex:"SELECT name FROM products WHERE category = 'Shirt';",task:'Show the name and price of products priced below £50.',hint:['Add WHERE after FROM.','The condition is price < 50.'],solution:'SELECT name, price FROM products WHERE price < 50;',why:'The filter keeps only products whose price is below 50. The condition is evaluated row by row.',skill:'where'},
{title:'Sort the shelf',zone:0,concept:'ORDER BY sorts results. DESC means highest to lowest; ASC means lowest to highest.',ex:'SELECT name, price FROM products ORDER BY price DESC LIMIT 3;',task:'Show product name and price, from most expensive to cheapest.',hint:['Sort on price.','Use ORDER BY price DESC.'],solution:'SELECT name, price FROM products ORDER BY price DESC;',why:'Sorting changes the order of the output, not which rows qualify.',skill:'sort'},
{title:'Find active shirts',zone:1,concept:'Combine conditions with AND when both must be true. Numeric values do not need quotes.',ex:"SELECT name FROM products WHERE category = 'Shirt' AND active = 1;",task:'Show name, team and price for active products in the Shirt category.',hint:['You need two conditions joined by AND.','category = \'Shirt\' and active = 1.'],solution:"SELECT name, team, price FROM products WHERE category = 'Shirt' AND active = 1;",why:'This is a common data-quality filter: the product category matches and the item is active.',skill:'where'},
{title:'Price band',zone:1,concept:'BETWEEN includes both endpoints. IN is a tidy way to match one of several values.',ex:'SELECT name FROM products WHERE price BETWEEN 20 AND 50;',task:'Show name and team for products priced from £20 to £50 inclusive.',hint:['Use BETWEEN 20 AND 50.','Filter the products table.'],solution:'SELECT name, team FROM products WHERE price BETWEEN 20 AND 50;',why:'BETWEEN includes both 20 and 50. If your business definition excludes an endpoint, use explicit greater-than/less-than comparisons.',skill:'where'},
{title:'Spot a missing value',zone:1,concept:'NULL represents a missing or unknown value. Test it with IS NULL, never = NULL.',ex:'SELECT * FROM customers WHERE country IS NULL;',task:'Find the customer IDs and names with no country recorded.',hint:['Use the customers table.','The condition is country IS NULL.'],solution:'SELECT id, name FROM customers WHERE country IS NULL;',why:'Missing data is not the same as an empty string or zero. IS NULL is the correct test.',skill:'quality'},
{title:'Search text patterns',zone:1,concept:'LIKE matches patterns: % means any number of characters and _ means one character.',ex:"SELECT name FROM products WHERE name LIKE '%Shirt%';",task:'Find product names containing the word Shirt. Return name and team.',hint:['Use LIKE with % around Shirt.','Text pattern goes in single quotes.'],solution:"SELECT name, team FROM products WHERE name LIKE '%Shirt%';",why:'Pattern matching is useful for messy product names, supplier descriptions and catalogue audits.',skill:'where'},
{title:'Count the catalogue',zone:2,concept:'COUNT(*) counts rows. Aggregates turn many records into a KPI.',ex:'SELECT COUNT(*) AS product_count FROM products;',task:'Return the number of products as product_count.',hint:['Use COUNT(*).','Give the output column the alias product_count.'],solution:'SELECT COUNT(*) AS product_count FROM products;',why:'A clear alias makes your output easier to read and use in a dashboard.',skill:'aggregate'},
{title:'Average and extremes',zone:2,concept:'AVG, MIN and MAX summarise a numeric column. ROUND can control displayed precision.',ex:'SELECT ROUND(AVG(price), 2) AS avg_price FROM products;',task:'Return the average product price rounded to 2 decimal places as avg_price.',hint:['Use AVG(price).','Wrap it in ROUND(..., 2).'],solution:'SELECT ROUND(AVG(price), 2) AS avg_price FROM products;',why:'Check whether the average is the right metric for the business question; a few high-priced items can skew it.',skill:'aggregate'},
{title:'Group the range',zone:2,concept:'GROUP BY creates one result row per group. Every selected column must be grouped or aggregated.',ex:'SELECT category, COUNT(*) AS n FROM products GROUP BY category;',task:'Show each category and its number of products as n, highest count first.',hint:['Group by category and count rows.','Sort by n descending.'],solution:'SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY n DESC;',why:'This turns the product list into a range coverage summary. The alias n can be used in ORDER BY.',skill:'group'},
{title:'Filter after grouping',zone:2,concept:'WHERE filters rows before aggregation. HAVING filters grouped results after aggregation.',ex:'SELECT team, COUNT(*) AS n FROM products GROUP BY team HAVING COUNT(*) > 2;',task:'Show teams with at least 3 products and their count as n.',hint:['Group by team.','Use HAVING COUNT(*) >= 3.'],solution:'SELECT team, COUNT(*) AS n FROM products GROUP BY team HAVING COUNT(*) >= 3;',why:'HAVING is the right place to filter on a count or other aggregate.',skill:'group'},
{title:'Join orders to customers',zone:3,concept:'JOIN combines related tables. ON tells SQL which key connects them.',ex:'SELECT o.id, c.name FROM orders o JOIN customers c ON o.customer_id = c.id;',task:'Show order ID, order date and customer name for every order.',hint:['Use orders as o and customers as c.','Join on o.customer_id = c.id.'],solution:'SELECT o.id, o.order_date, c.name FROM orders o JOIN customers c ON o.customer_id = c.id;',why:'The customer_id foreign key connects each order to the customer record. Aliases make longer queries easier to read.',skill:'join'},
{title:'Add product details',zone:3,concept:'You can join more than two tables. Join each table on its own matching key.',ex:'SELECT o.id, p.name FROM orders o JOIN products p ON o.product_id = p.id;',task:'Show order ID, product name and quantity for every order.',hint:['Join orders to products.','Use o.product_id = p.id.'],solution:'SELECT o.id, p.name, o.qty FROM orders o JOIN products p ON o.product_id = p.id;',why:'The order line stores a product ID, not all the descriptive product information. A join brings the product name into the result.',skill:'join'},
{title:'Keep every product',zone:3,concept:'LEFT JOIN keeps every row from the left table, even when there is no match on the right.',ex:'SELECT p.name, o.id FROM products p LEFT JOIN orders o ON p.id = o.product_id;',task:'Find every product that has never been ordered. Return product ID and name.',hint:['Start from products, then LEFT JOIN orders.','Unmatched rows have o.id IS NULL.'],solution:'SELECT p.id, p.name FROM products p LEFT JOIN orders o ON p.id = o.product_id WHERE o.id IS NULL;',why:'This anti-join pattern is a powerful way to find catalogue items with no orders. It is not automatically proof of dead stock; check stock, dates and eligibility too.',skill:'join'},
{title:'Revenue by product',zone:4,concept:'A line-level value can be calculated with arithmetic, then aggregated with SUM.',ex:'SELECT p.name, SUM(o.qty * p.price) AS revenue FROM orders o JOIN products p ON p.id = o.product_id GROUP BY p.name;',task:'Show each product name and gross order value as revenue, highest first. Include all order statuses for now.',hint:['Join orders to products.','Sum qty * price and group by product name.'],solution:'SELECT p.name, SUM(o.qty * p.price) AS revenue FROM orders o JOIN products p ON p.id = o.product_id GROUP BY p.name ORDER BY revenue DESC;',why:'This is gross order value using current catalogue price. In real reporting, use the transaction price and define how returns, cancellations, tax and discounts are treated.',skill:'business'},
{title:'Sales by channel',zone:4,concept:'Join fact data to dimensions to add business context. Group on the dimension you want to compare.',ex:'SELECT st.channel, SUM(s.units) AS units FROM sales s JOIN stores st ON st.id = s.store_id GROUP BY st.channel;',task:'Show total units sold by channel, highest first.',hint:['Join sales to stores.','Group by channel and SUM(s.units).'],solution:'SELECT st.channel, SUM(s.units) AS units FROM sales s JOIN stores st ON st.id = s.store_id GROUP BY st.channel ORDER BY units DESC;',why:'The sales table records activity; stores supplies the channel label. This is a basic fact-and-dimension model.',skill:'business'},
{title:'Top-selling products',zone:4,concept:'Rank aggregate results with ORDER BY and LIMIT. Always decide what “top” means: units, revenue, margin or sell-through.',ex:'SELECT product_id, SUM(units) AS units FROM sales GROUP BY product_id ORDER BY units DESC LIMIT 5;',task:'Show the top 5 products by total units sold. Return product_id and units.',hint:['Group sales by product_id.','Sort SUM(units) descending and LIMIT 5.'],solution:'SELECT product_id, SUM(units) AS units FROM sales GROUP BY product_id ORDER BY units DESC LIMIT 5;',why:'Top sellers by units are not necessarily the most valuable or profitable products. Metric choice changes the decision.',skill:'business'},
{title:'Margin, not just revenue',zone:4,concept:'Margin value is revenue minus cost of goods. Join product cost to sales units before summing.',ex:'SELECT p.name, SUM(s.units * (p.price-p.cost)) AS margin FROM sales s JOIN products p ON p.id=s.product_id GROUP BY p.name;',task:'Show each product name and estimated gross margin value as margin, highest first.',hint:['Join sales to products.','Calculate units * (price - cost), then SUM it.'],solution:'SELECT p.name, SUM(s.units * (p.price - p.cost)) AS margin FROM sales s JOIN products p ON p.id = s.product_id GROUP BY p.name ORDER BY margin DESC;',why:'This is an estimate using current price and cost, before discounts and other costs. A good analyst states assumptions instead of presenting a proxy as exact profit.',skill:'business'},
{title:'CASE: make useful tiers',zone:4,concept:'CASE WHEN creates a label from rules. Put the most specific or highest-priority condition first.',ex:"SELECT name, CASE WHEN stock = 0 THEN 'Out of stock' WHEN stock < 20 THEN 'Low' ELSE 'Healthy' END AS stock_status FROM products;",task:'Label products: Out of stock when stock is 0, Low when stock is under 20, otherwise Healthy. Show name and stock_status.',hint:['Start CASE WHEN stock = 0.','Add a second WHEN, then ELSE, and END AS stock_status.'],solution:"SELECT name, CASE WHEN stock = 0 THEN 'Out of stock' WHEN stock < 20 THEN 'Low' ELSE 'Healthy' END AS stock_status FROM products;",why:'Rule order matters: zero stock must be checked before stock below 20 or it would also match Low.',skill:'case'},
{title:'Compare to the average',zone:4,concept:'A scalar subquery can calculate a benchmark used by the outer query.',ex:'SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products);',task:'Find product names and prices above the average catalogue price, highest price first.',hint:['The subquery returns AVG(price).','Compare each price with that value.'],solution:'SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products) ORDER BY price DESC;',why:'Benchmarks help identify outliers. In a business analysis, consider comparing within category or team as well as across the whole range.',skill:'subquery'},
{title:'Fix messy text',zone:5,concept:'TRIM removes surrounding spaces; LOWER standardises case. Apply the same transformation consistently.',ex:'SELECT LOWER(TRIM(email)) AS email_clean FROM raw_orders;',task:'Show each raw order ID and its cleaned product name (trimmed and lower case) as product_clean.',hint:['Use LOWER(TRIM(product)).','Alias it product_clean.'],solution:'SELECT id, LOWER(TRIM(product)) AS product_clean FROM raw_orders;',why:'Normalising strings can reveal duplicates and mismatches. Keep the raw source alongside cleaned fields in a real pipeline so transformations are auditable.',skill:'quality'},
{title:'Check data completeness',zone:5,concept:'Data quality analysis often begins with counts of missing keys, invalid values and duplicates.',ex:'SELECT COUNT(*) AS rows_total, SUM(CASE WHEN email IS NULL THEN 1 ELSE 0 END) AS missing_email FROM raw_orders;',task:'Return total rows as rows_total and rows with a missing email as missing_email.',hint:['COUNT(*) counts every row.','Use SUM(CASE WHEN email IS NULL THEN 1 ELSE 0 END).'],solution:'SELECT COUNT(*) AS rows_total, SUM(CASE WHEN email IS NULL THEN 1 ELSE 0 END) AS missing_email FROM raw_orders;',why:'A count of missing values tells you the scale of the issue, not the business impact. Add product value, stock or sales context to prioritise fixes.',skill:'quality'},
{title:'Capstone: find stock risk',zone:6,concept:'A good commercial query turns raw data into a decision. Combine filters, a calculated metric and an explicit ranking.',ex:'SELECT name, team, stock, price, stock * price AS stock_retail_value FROM products WHERE active = 1 ORDER BY stock_retail_value DESC;',task:'Build a stock-risk shortlist: show product name, team, stock and stock retail value (stock * price) for active products with stock below 30. Sort by stock retail value highest first.',hint:['Filter active = 1 and stock < 30.','Calculate stock * price as stock_retail_value.','Sort descending by the calculated value.'],solution:'SELECT name, team, stock, stock * price AS stock_retail_value FROM products WHERE active = 1 AND stock < 30 ORDER BY stock_retail_value DESC;',why:'This highlights the retail value tied up in low-stock products, not aged or inactive inventory. To make it decision-ready, join sales velocity, product lifecycle and replenishment lead times.',skill:'capstone'},
{title:'Capstone: customer sales',zone:6,concept:'For a stakeholder-ready result, define the population first, then aggregate and label the measure clearly.',ex:"SELECT c.country, COUNT(*) AS orders FROM orders o JOIN customers c ON c.id=o.customer_id GROUP BY c.country;",task:'Show each customer country and order count as order_count, highest count first. Exclude orders that are Cancelled or Returned.',hint:['Join orders to customers.','Filter status NOT IN ('+"'Cancelled', 'Returned'"+').','Group by country and count order IDs.'],solution:"SELECT c.country, COUNT(o.id) AS order_count FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.status NOT IN ('Cancelled', 'Returned') GROUP BY c.country ORDER BY order_count DESC;",why:'The definition of a valid order materially changes the result. Always agree on statuses and how missing country values should be handled.',skill:'capstone'},
{title:'Final boss: build the briefing',zone:6,concept:'The last step is analyst judgement: combine evidence, state limitations and give the decision-maker a useful next action.',ex:'SELECT p.team, COUNT(*) AS products, SUM(p.stock) AS units_in_stock FROM products p GROUP BY p.team;',task:'Create a team-level stock briefing. Show team, number of active products as active_products, total stock units as stock_units and total retail stock value as retail_stock_value. Only include active products. Sort by retail_stock_value descending.',hint:['Filter active = 1.','Group by team; count rows and sum stock and stock * price.','Use clear aliases and sort on retail_stock_value DESC.'],solution:'SELECT team, COUNT(*) AS active_products, SUM(stock) AS stock_units, SUM(stock * price) AS retail_stock_value FROM products WHERE active = 1 GROUP BY team ORDER BY retail_stock_value DESC;',why:'This is a useful first briefing, not the end of the analysis. Before acting, check whether stock is available, blocked, future launch inventory, aged, or already allocated; add sales and margin context.',skill:'capstone'}
,{title:'Define the grain before joining',zone:7,concept:'Grain means what one row represents. A sales row is a product-store-date observation; a product row is one product. State the grain before joining or aggregating.',ex:'SELECT product_id, COUNT(*) AS sales_rows FROM sales GROUP BY product_id;',task:'Return each product_id and its number of sales rows as sales_rows, highest first. Use this to inspect the sales fact grain.',hint:['Start from sales.','Group by product_id and count rows.'],solution:'SELECT product_id, COUNT(*) AS sales_rows FROM sales GROUP BY product_id ORDER BY sales_rows DESC;',why:'Before joining two fact tables, establish their grain and key uniqueness. Otherwise many-to-many joins can multiply rows and inflate revenue.',skill:'model'},
{title:'Find unmatched competitor products',zone:7,concept:'A LEFT JOIN preserves every row from the left table. Filtering for a missing right-side key identifies unmatched records.',ex:'SELECT cp.id, cp.product_id FROM competitor_prices cp LEFT JOIN products p ON p.id = cp.product_id WHERE p.id IS NULL;',task:'Find competitor price records whose product_id does not exist in products. Return competitor record id and product_id.',hint:['Start with competitor_prices and LEFT JOIN products.','Keep rows where p.id IS NULL.'],solution:'SELECT cp.id, cp.product_id FROM competitor_prices cp LEFT JOIN products p ON p.id = cp.product_id WHERE p.id IS NULL;',why:'Unmatched keys can indicate mapping failures, retired products or source defects. Route them to an owner rather than silently dropping them.',skill:'model'},
{title:'Spot duplicate business keys',zone:7,concept:'A duplicate is defined by a business key, not necessarily a repeated numeric ID. GROUP BY and HAVING reveal keys occurring more than once.',ex:'SELECT LOWER(TRIM(email)) AS email_key, LOWER(TRIM(product)) AS product_key, COUNT(*) AS occurrences FROM raw_orders WHERE email IS NOT NULL GROUP BY LOWER(TRIM(email)), LOWER(TRIM(product)) HAVING COUNT(*) > 1;',task:'Find repeated cleaned email-and-product combinations in raw_orders. Return email_key, product_key and occurrences.',hint:['Normalise text with LOWER(TRIM(...)).','Group by both cleaned expressions and use HAVING COUNT(*) > 1.'],solution:'SELECT LOWER(TRIM(email)) AS email_key, LOWER(TRIM(product)) AS product_key, COUNT(*) AS occurrences FROM raw_orders WHERE email IS NOT NULL GROUP BY LOWER(TRIM(email)), LOWER(TRIM(product)) HAVING COUNT(*) > 1;',why:'Never deduplicate by deleting rows blindly. Confirm the true business key, retain source identifiers and decide which record is authoritative.',skill:'model'},
{title:'Measure data completeness',zone:7,concept:'A quality metric should have a clear denominator, a reproducible rule and a named owner. Counts are often easier to validate than a single opaque score.',ex:'SELECT COUNT(*) AS total_products, SUM(CASE WHEN name IS NULL THEN 1 ELSE 0 END) AS missing_name FROM products;',task:'Return total products and the number with missing name as missing_name.',hint:['Use COUNT(*) for the denominator.','Use SUM(CASE WHEN name IS NULL THEN 1 ELSE 0 END).'],solution:'SELECT COUNT(*) AS total_products, SUM(CASE WHEN name IS NULL THEN 1 ELSE 0 END) AS missing_name FROM products;',why:'A quality percentage without a denominator and definition is hard to trust. Break quality into actionable dimensions and connect defects to commercial impact.',skill:'quality'},
{title:'Price position versus competitors',zone:8,concept:'Commercial comparisons need a like-for-like match, a clear reference price and a sign convention. Positive gaps can mean your price is higher than competitor price.',ex:'SELECT p.name, p.price AS our_price, MIN(cp.price) AS cheapest_competitor FROM products p JOIN competitor_prices cp ON cp.product_id = p.id GROUP BY p.name, p.price;',task:'For matched products, show product name, our price and cheapest competitor price. Sort by our price minus competitor price, largest first.',hint:['Join products to competitor_prices on product ID.','Group by product name and price; use MIN(cp.price).'],solution:'SELECT p.name, p.price AS our_price, MIN(cp.price) AS cheapest_competitor, p.price - MIN(cp.price) AS price_gap FROM products p JOIN competitor_prices cp ON cp.product_id = p.id GROUP BY p.name, p.price ORDER BY price_gap DESC;',why:'A price gap is not automatically an opportunity. Confirm match confidence, size/variant equivalence, shipping, promotions and stock availability.',skill:'commercial'},
{title:'Calculate stock cover',zone:8,concept:'Stock cover estimates how many weeks current stock may last at the observed weekly sales rate. Guard against zero or missing velocity.',ex:'SELECT product_id, stock, avg_weekly_units, stock / avg_weekly_units AS weeks_cover FROM inventory_metrics;',task:'Show product_id, stock, avg_weekly_units and weeks_cover for products with positive weekly sales. Sort from lowest cover to highest.',hint:['Use inventory_metrics.','Filter avg_weekly_units > 0 and divide stock by avg_weekly_units.'],solution:'SELECT product_id, stock, avg_weekly_units, stock / avg_weekly_units AS weeks_cover FROM inventory_metrics WHERE avg_weekly_units > 0 ORDER BY weeks_cover ASC;',why:'This is a simple run-rate estimate, not a forecast. Seasonality, launch calendars, replenishment, blocked stock and demand changes can make recent velocity misleading.',skill:'commercial'},
{title:'Prioritise blocked inventory',zone:8,concept:'A good operational metric distinguishes total stock from sellable stock. Use blocked units and age to prioritise the commercial action.',ex:'SELECT product_id, blocked_units, age_days FROM inventory_metrics;',task:'Find products with blocked units or stock aged at least 60 days. Return product_id, blocked_units and age_days, oldest first.',hint:['Use OR because either condition should qualify.','blocked_units > 0 OR age_days >= 60.'],solution:'SELECT product_id, blocked_units, age_days FROM inventory_metrics WHERE blocked_units > 0 OR age_days >= 60 ORDER BY age_days DESC;',why:'This creates an action list, not a financial benefit estimate. Add inventory value, reason code, accountable owner and outcome tracking before claiming savings.',skill:'commercial'},
{title:'Reconcile pipeline rows',zone:8,concept:'A reconciliation compares expected source volume with output volume and flags differences for investigation.',ex:'SELECT pipeline, run_date, rows_read, rows_written, rows_read - rows_written AS row_difference FROM pipeline_runs;',task:'Show pipeline, run_date, rows_read, rows_written and row_difference for every run. Put the largest absolute differences first.',hint:['Subtract rows_written from rows_read.','Use ORDER BY row_difference DESC for a first pass; inspect negative and positive differences.'],solution:'SELECT pipeline, run_date, rows_read, rows_written, rows_read - rows_written AS row_difference FROM pipeline_runs ORDER BY row_difference DESC;',why:'Row counts alone do not prove correctness. Reconcile amounts, keys, duplicates, rejected rows and freshness, and define acceptable thresholds.',skill:'commercial'},
{title:'Use a subquery as a benchmark',zone:9,concept:'A subquery can make a benchmark explicit. For a large model, consider a CTE to name and reuse a complex intermediate result.',ex:'SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products);',task:'Find products priced above the average price of all products. Return name and price, most expensive first.',hint:['The inner query calculates AVG(price).','Compare each row price to the scalar result.'],solution:'SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products) ORDER BY price DESC;',why:'This benchmark uses the whole catalogue. In a real analysis, the relevant comparison may be category, team, region or active range only.',skill:'advanced'},
{title:'Build a monthly sales trend',zone:9,concept:'Trend analysis requires a consistent time grain. Here, the first seven characters of the ISO date provide a YYYY-MM month key.',ex:'SELECT SUBSTRING(sale_date, 1, 7) AS sales_month, SUM(units) AS units FROM sales GROUP BY SUBSTRING(sale_date, 1, 7);',task:'Return monthly sales units as sales_month and units, oldest month first.',hint:['Use SUBSTRING(sale_date, 1, 7) as a month key.','Group by the same expression and sum units.'],solution:'SELECT SUBSTRING(sale_date, 1, 7) AS sales_month, SUM(units) AS units FROM sales GROUP BY SUBSTRING(sale_date, 1, 7) ORDER BY sales_month;',why:'Use proper date types and calendar tables in production. A text month key is a teaching shortcut; incomplete periods must not be compared with full periods.',skill:'advanced'},
{title:'Calculate discounted sales value',zone:9,concept:'A commercial measure must reflect the transaction logic. A discount percentage of 10 means the customer pays 90% of list price.',ex:'SELECT product_id, SUM(units * price) AS list_value FROM sales JOIN products ON products.id = sales.product_id GROUP BY product_id;',task:'Calculate estimated net sales value by product_id using units × current product price × (1 − discount_pct / 100). Sort highest first.',hint:['Join sales to products.','Apply (1 - discount_pct / 100.0) to unit price before multiplying by units.'],solution:'SELECT s.product_id, SUM(s.units * p.price * (1 - s.discount_pct / 100.0)) AS net_sales_value FROM sales s JOIN products p ON p.id = s.product_id GROUP BY s.product_id ORDER BY net_sales_value DESC;',why:'This estimate uses current catalogue price, not a historical transaction price, and ignores returns/tax/fees. Define the official revenue measure with Finance.',skill:'advanced'},
{title:'Compare channels without hiding zeros',zone:9,concept:'A LEFT JOIN can retain dimension members with no matching facts. This is useful when a report must show zero activity, not just active channels.',ex:'SELECT st.channel, COUNT(s.id) AS sales_rows FROM stores st LEFT JOIN sales s ON s.store_id = st.id GROUP BY st.channel;',task:'Show every channel and its number of sales rows, including channels with zero sales rows. Return channel and sales_rows.',hint:['Start with stores and LEFT JOIN sales.','Count s.id, not COUNT(*), so unmatched rows count as zero.'],solution:'SELECT st.channel, COUNT(s.id) AS sales_rows FROM stores st LEFT JOIN sales s ON s.store_id = st.id GROUP BY st.channel ORDER BY st.channel;',why:'COUNT(*) would count the preserved unmatched row. COUNT of the nullable fact key is the correct pattern for zero-activity reporting.',skill:'advanced'},
{title:'Create an exception queue',zone:10,concept:'Data governance becomes operational when exceptions have a condition, an owner, severity and a route to resolution.',ex:'SELECT id, pipeline, status, duration_seconds FROM pipeline_runs WHERE status <> \'success\';',task:'Find all pipeline runs that did not succeed. Return id, pipeline, status and duration_seconds.',hint:['Filter the pipeline_runs table.','Use WHERE status <> \'success\'.'],solution:"SELECT id, pipeline, status, duration_seconds FROM pipeline_runs WHERE status <> 'success' ORDER BY duration_seconds DESC;",why:'An exception query should become a monitored control with a threshold, owner, alert path and documented recovery steps—not a spreadsheet someone checks occasionally.',skill:'governance'},
{title:'Protect personal data by design',zone:10,concept:'Data minimisation means querying only the fields needed for a legitimate purpose. Aggregate results often answer business questions without exposing names or email addresses.',ex:'SELECT country, COUNT(*) AS customers FROM customers GROUP BY country;',task:'Return customer counts by country without exposing individual customer names. Include missing country values as their own group.',hint:['Select country and COUNT(*).','Group by country; NULL will appear as a separate group.'],solution:'SELECT country, COUNT(*) AS customers FROM customers GROUP BY country ORDER BY customers DESC;',why:'Use role-based access, approved purposes, retention rules and masked or aggregated outputs. A query is not authorised merely because the data is technically accessible.',skill:'governance'},
{title:'Design a reconciliation control',zone:10,concept:'A control should detect a defined failure mode and make the size of the issue visible. Compare source and destination counts and identify non-zero differences.',ex:'SELECT pipeline, rows_read - rows_written AS difference FROM pipeline_runs;',task:'Return only pipeline runs where rows_read differs from rows_written. Show pipeline, run_date and difference.',hint:['Calculate rows_read - rows_written.','Use WHERE rows_read <> rows_written.'],solution:'SELECT pipeline, run_date, rows_read - rows_written AS difference FROM pipeline_runs WHERE rows_read <> rows_written ORDER BY difference DESC;',why:'A production control needs a tolerance, clear ownership and escalation path. Some pipelines legitimately filter rows, so document expected exclusions before flagging failures.',skill:'governance'},
{title:'Measure freshness and runtime',zone:10,concept:'Operational analytics often monitors freshness, duration, failures and volume. A slow run can be a symptom of source growth or a query-plan change.',ex:'SELECT pipeline, MAX(run_date) AS latest_run FROM pipeline_runs GROUP BY pipeline;',task:'Show each pipeline and its latest run date as latest_run.',hint:['Group pipeline_runs by pipeline.','Use MAX(run_date).'],solution:'SELECT pipeline, MAX(run_date) AS latest_run FROM pipeline_runs GROUP BY pipeline ORDER BY pipeline;',why:'Freshness is not only the latest date: compare expected cadence, successful completion time and business deadlines. Keep monitoring separate from the report itself.',skill:'governance'},
{title:'Investigate slow queries systematically',zone:11,concept:'Performance work starts with evidence: rows scanned, join keys, filters, cardinality and execution plan. Avoid guessing or adding indexes without measurement.',ex:'SELECT pipeline, duration_seconds FROM pipeline_runs ORDER BY duration_seconds DESC;',task:'Rank pipeline runs from slowest to fastest. Return pipeline, run_date and duration_seconds.',hint:['Select the runtime columns.','Sort duration_seconds descending.'],solution:'SELECT pipeline, run_date, duration_seconds FROM pipeline_runs ORDER BY duration_seconds DESC;',why:'In a real database, inspect EXPLAIN/EXPLAIN ANALYZE, table statistics, indexes and actual row counts. This in-browser engine is a learning sandbox, not a production query planner.',skill:'production'},
{title:'Choose a safer join key',zone:11,concept:'Join on stable identifiers, not display names. Names can change, collide or differ in case; a key should have defined uniqueness and referential integrity.',ex:'SELECT p.id, p.name, cp.competitor, cp.price FROM products p JOIN competitor_prices cp ON cp.product_id = p.id;',task:'Return matched product ID, product name, competitor and competitor price. Exclude competitor rows with no matching product.',hint:['Join products to competitor_prices.','Match p.id = cp.product_id.'],solution:'SELECT p.id, p.name, cp.competitor, cp.price FROM products p JOIN competitor_prices cp ON cp.product_id = p.id ORDER BY p.id, cp.competitor;',why:'In a warehouse, document primary keys, foreign keys, natural keys, surrogate keys and expected cardinality. Do not use DISTINCT to hide unexplained duplicate joins.',skill:'production'},
{title:'Spot failed or partial runs',zone:11,concept:'A successful status does not always mean complete output. Compare read/write counts and runtime to detect suspicious partial loads.',ex:'SELECT pipeline, status, rows_read, rows_written FROM pipeline_runs;',task:'Flag pipeline runs where status is not success OR rows_written is less than rows_read. Return pipeline, status, rows_read and rows_written.',hint:['Combine conditions with OR.','Use status <> \'success\' OR rows_written < rows_read.'],solution:"SELECT pipeline, status, rows_read, rows_written FROM pipeline_runs WHERE status <> 'success' OR rows_written < rows_read ORDER BY pipeline;",why:'Agree which row differences are expected, then turn the rule into a tested data contract with alerting and a recovery owner.',skill:'production'},
{title:'Write a metric contract',zone:11,concept:'Every KPI should have a name, business definition, grain, filters, exclusions, owner, refresh cadence and source lineage.',ex:'SELECT status, COUNT(*) AS order_lines FROM orders GROUP BY status;',task:'Return each order status and its order-line count. This is the evidence base for defining which statuses count as valid orders.',hint:['Group orders by status.','Count order IDs and use a clear alias.'],solution:'SELECT status, COUNT(id) AS order_lines FROM orders GROUP BY status ORDER BY order_lines DESC;',why:'Before a metric goes into a dashboard, agree whether it counts orders, order lines, units, gross value or net revenue—and how cancellations and returns are treated.',skill:'production'},
{title:'Capstone: price and stock decision',zone:12,concept:'A leader brings together commercial context, data quality and an explicit action rule. Use a matched competitor benchmark and inventory cover to build a review queue.',ex:'SELECT p.name, p.price, im.stock, im.avg_weekly_units FROM products p JOIN inventory_metrics im ON im.product_id = p.id;',task:'Build a review queue for active products where our price is above the cheapest matched competitor and stock cover is over 8 weeks. Return product, our price, competitor price and weeks cover, sorted by largest price gap first.',hint:['Join products, competitor_prices and inventory_metrics.','Aggregate competitor prices to MIN by product; calculate stock / avg_weekly_units.','Filter active products, positive sales velocity, price gap > 0 and weeks cover > 8.'],solution:'SELECT p.name, p.price AS our_price, MIN(cp.price) AS competitor_price, im.stock / im.avg_weekly_units AS weeks_cover, p.price - MIN(cp.price) AS price_gap FROM products p JOIN competitor_prices cp ON cp.product_id = p.id JOIN inventory_metrics im ON im.product_id = p.id WHERE p.active = 1 AND im.avg_weekly_units > 0 GROUP BY p.name, p.price, im.stock, im.avg_weekly_units HAVING p.price > MIN(cp.price) AND im.stock / im.avg_weekly_units > 8 ORDER BY price_gap DESC;',why:'This is a prioritised review list, not an automatic repricing instruction. Validate product match, margin floors, promotion calendar, stock availability, seasonality and approval rules before action.',skill:'capstone'},
{title:'Capstone: explain a data product',zone:12,concept:'Technical leadership includes communicating the product contract: who uses it, what decision it supports, how it is built, and how users know it is trustworthy.',ex:'SELECT pipeline, status, MAX(run_date) AS latest_run FROM pipeline_runs GROUP BY pipeline, status;',task:'Create a compact operational summary with pipeline, status and run count, sorted by pipeline then status.',hint:['Group by pipeline and status.','Count run IDs and alias the result run_count.'],solution:'SELECT pipeline, status, COUNT(id) AS run_count FROM pipeline_runs GROUP BY pipeline, status ORDER BY pipeline, status;',why:'A leader should be able to describe sources, transformations, grain, metric definitions, refresh SLAs, quality controls, access boundaries, failure modes and business adoption.',skill:'capstone'},
{title:'Leadership review: challenge the number',zone:12,concept:'A strong analytics leader asks whether the result is valid before discussing what it means. Reconcile grain, population, time window, exclusions and source freshness.',ex:'SELECT status, COUNT(*) AS rows FROM orders GROUP BY status;',task:'Return order counts by status. Use the result to explain why total order rows cannot automatically be called completed orders.',hint:['Group by status and count IDs.','Your written explanation matters: status is part of the metric definition.'],solution:'SELECT status, COUNT(id) AS order_count FROM orders GROUP BY status ORDER BY order_count DESC;',why:'In a review, state what is known, what is assumed, how you validated it, which stakeholders own the definition and what decision the metric can safely support.',skill:'capstone'},
{title:'Leadership review: recommend the next control',zone:12,concept:'Move from one-off SQL to repeatable controls. Choose a control that detects a material failure, assign an owner and define the response.',ex:'SELECT pipeline, status, rows_read, rows_written FROM pipeline_runs;',task:'Find runs that failed or dropped rows, then explain what alert, tolerance and owner you would attach in production.',hint:['Use status <> \'success\' OR rows_written < rows_read.','A production control needs an alert threshold and an escalation route.'],solution:"SELECT pipeline, status, rows_read, rows_written FROM pipeline_runs WHERE status <> 'success' OR rows_written < rows_read ORDER BY pipeline;",why:'SQL is only one part of the control: production readiness also needs scheduling, monitoring, retries, logging, access control, testing and a named business owner.',skill:'capstone'}


,{title:'Target attainment by store',zone:13,concept:'Actuals and targets must be aligned to the same store-period grain before comparison.',ex:'SELECT store_id, SUM(units) AS units FROM sales GROUP BY store_id;',task:'Compare estimated sales value with targets by store for September 2025. Return store_id, actual_value, target_value and variance. This is a proxy using current catalogue price.',hint:['Join sales to products and aggregate sales value by store and month.','Join targets on store_id and period = SUBSTRING(sale_date, 1, 7).'],solution:"SELECT t.store_id, SUM(s.units * p.price * (1 - s.discount_pct / 100.0)) AS actual_value, t.target AS target_value, SUM(s.units * p.price * (1 - s.discount_pct / 100.0)) - t.target AS variance FROM targets t JOIN sales s ON s.store_id = t.store_id AND SUBSTRING(s.sale_date, 1, 7) = t.period JOIN products p ON p.id = s.product_id WHERE t.period = '2025-09' GROUP BY t.store_id, t.target ORDER BY variance DESC;",why:'This aligns store-month grain, but production reporting must align target and actual definitions, currency, discounts, returns, tax and period rules.',skill:'commercial'},
{title:'Understand acquisition cohorts',zone:13,concept:'A cohort groups people by a shared starting event such as join month. This distinguishes new-customer volume from the behaviour of existing customers.',ex:'SELECT SUBSTRING(joined, 1, 7) AS join_month, COUNT(*) AS new_customers FROM customers GROUP BY SUBSTRING(joined, 1, 7);',task:'Count customers by join month. Return join_month and new_customers, oldest first.',hint:['Use SUBSTRING(joined, 1, 7) as a month key.','Group by that expression and count customers.'],solution:'SELECT SUBSTRING(joined, 1, 7) AS join_month, COUNT(*) AS new_customers FROM customers GROUP BY SUBSTRING(joined, 1, 7) ORDER BY join_month;',why:'This measures acquisition only, not retention. Retention needs an activity event and cohort-period matrix.',skill:'advanced'},
{title:'Measure revenue concentration',zone:13,concept:'Concentration analysis shows dependence on a small number of products or teams and can guide prioritisation and risk discussion.',ex:'SELECT product_id, SUM(units) AS units FROM sales GROUP BY product_id;',task:'Return product_id and estimated net sales value using current product price and observed discount, highest first.',hint:['Join sales to products.','Sum units × price × (1 - discount_pct / 100.0) by product_id.'],solution:'SELECT s.product_id, SUM(s.units * p.price * (1 - s.discount_pct / 100.0)) AS net_sales_value FROM sales s JOIN products p ON p.id = s.product_id GROUP BY s.product_id ORDER BY net_sales_value DESC;',why:'Pair concentration with margin, stock risk, supplier dependency and lifecycle; this sample is too small for strategic conclusions.',skill:'commercial'},
{title:'Rank within a category',zone:13,concept:'Window functions such as ROW_NUMBER(), RANK() and SUM() OVER(PARTITION BY ...) rank or calculate running totals without collapsing detail rows. This exercise uses a correlated subquery equivalent for compatibility.',ex:'SELECT p.name, p.category, p.price FROM products p;',task:'Rank products by price within category, highest price ranked 1. Return name, category, price and category_price_rank.',hint:['Count products in the same category with a higher price.','Add 1 to that count and alias category_price_rank.'],solution:'SELECT p.name, p.category, p.price, (SELECT COUNT(*) + 1 FROM products p2 WHERE p2.category = p.category AND p2.price > p.price) AS category_price_rank FROM products p ORDER BY p.category, category_price_rank, p.name;',why:'In PostgreSQL, SQL Server and many warehouses, a window function is usually clearer. Learn the concept and confirm support in the SQL dialect you use.',skill:'advanced'},
{title:'Define a metric contract',zone:13,concept:'A metric contract includes definition, grain, population, exclusions, source, owner, refresh cadence, quality checks and intended decision.',ex:'SELECT status, COUNT(*) AS order_count FROM orders GROUP BY status;',task:'Return order counts by status and use the evidence to define what should count as a completed order.',hint:['Group by status and count order IDs.','State how cancelled, pending and returned orders are treated.'],solution:'SELECT status, COUNT(id) AS order_count FROM orders GROUP BY status ORDER BY status;',why:'A shared metric contract prevents dashboards from giving different answers to the same question. Version and approve definition changes.',skill:'governance'},
{title:'Final practicum: defend the recommendation',zone:13,concept:'A technical commercial leader connects query mechanics to a decision, limitations, controls and next steps.',ex:'SELECT p.name, p.stock, p.price FROM products p WHERE p.active = 1;',task:'Build a review list of active products with stock cover above 8 weeks and a positive gap above the cheapest competitor. Return product, our price, competitor price, weeks cover and price gap, largest gap first.',hint:['Join products, competitor_prices and inventory_metrics.','Use MIN competitor price and calculate stock / weekly units.','Filter active products, positive velocity, price gap > 0 and cover > 8.'],solution:'SELECT p.name, p.price AS our_price, MIN(cp.price) AS cheapest_competitor, im.stock / im.avg_weekly_units AS weeks_cover, p.price - MIN(cp.price) AS price_gap FROM products p JOIN competitor_prices cp ON cp.product_id = p.id JOIN inventory_metrics im ON im.product_id = p.id WHERE p.active = 1 AND im.avg_weekly_units > 0 GROUP BY p.name, p.price, im.stock, im.avg_weekly_units HAVING p.price > MIN(cp.price) AND im.stock / im.avg_weekly_units > 8 ORDER BY price_gap DESC;',why:'Present this as a prioritised investigation list, not an automatic price change. Defend match quality, margin guardrails, seasonality, inventory availability, assumptions, ownership and outcome measurement.',skill:'capstone'}
];
const SKILLS=[['select','Selecting columns'],['where','Filtering rows'],['sort','Sorting results'],['aggregate','Aggregations'],['group','Grouping & HAVING'],['join','Joins'],['business','Commercial metrics'],['case','CASE logic'],['subquery','Subqueries'],['quality','Data quality'],['model','Data modelling & grain'],['commercial','Commercial decision metrics'],['advanced','Advanced query patterns'],['governance','Governance & controls'],['production','Production readiness'],['capstone','Leadership capstones']];
const TABLEDESC={products:'Product master: price, cost, category, active flag and stock on hand.',customers:'Customer dimension: country and join date; includes one missing country.',orders:'Order lines: customer_id and product_id connect to dimension tables.',stores:'Store/channel dimension: retail and online channels.',sales:'Sales fact table: units, date, store and product. This is a small training sample.',targets:'Monthly store targets. Use this for target-versus-actual practice.',raw_orders:'Messy source extract: inconsistent casing, spaces, duplicates and N/A values.',competitor_prices:'Matched competitor observations with prices and checked dates; includes one orphan product key.',inventory_metrics:'Illustrative stock health inputs: stock, weekly sales run rate, blocked units and age.',pipeline_runs:'Example data pipeline monitoring records: status, row counts and runtime.'};
let state={xp:0,done:[],streak:0,last:'',runStreak:0,perfect:0,views:0,mistakes:{}};let current=0,view='home',activeZone=0,hintLevel=0,solvedCurrent=false,lastResult=null;
try{const saved=localStorage.getItem('queryQuestSave');if(saved)state=Object.assign(state,JSON.parse(saved));}catch(e){}
function save(){try{localStorage.setItem('queryQuestSave',JSON.stringify(state));}catch(e){}}
function recordMistake(i){if(!state.mistakes)state.mistakes={};state.mistakes[i]=(state.mistakes[i]||0)+1;save();}
function initDB(){if(!window.alasql)return;Object.keys(TABLES).forEach(t=>{alasql('DROP TABLE IF EXISTS '+t);alasql('CREATE TABLE '+t);alasql.tables[t].data=JSON.parse(JSON.stringify(TABLES[t]));});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rank(){const n=state.xp;return n>=1600?'Analytics Architect':n>=1100?'SQL Specialist':n>=700?'Senior Analyst':n>=400?'Analyst':n>=200?'Data Explorer':n>=80?'Query Builder':'SQL Recruit';}
function level(){return Math.floor(state.xp/100)+1;}function xpProgress(){return state.xp%100;}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100);}
function updateStats(){document.getElementById('topLevel').textContent='Level '+level();document.getElementById('topXP').textContent=state.xp+' XP';document.getElementById('topStreak').textContent=state.runStreak+' 🔥';document.getElementById('profileRank').textContent=rank();document.getElementById('profileLine').textContent=state.done.length+' / '+MISSIONS.length+' missions cleared';document.getElementById('sideXP').style.width=xpProgress()+'%';document.getElementById('sideXPText').textContent=xpProgress()+' / 100 XP to next rank';}
function zoneUnlocked(i){if(i===0)return true;return state.done.length>=ZONES[i].from;}
function drawZones(){const z=document.getElementById('zoneNav');z.innerHTML=ZONES.map((x,i)=>`<div class="zoneitem ${activeZone===i?'active':''} ${zoneUnlocked(i)?'':'locked'}" data-zone="${i}"><div class="zoneicon">${x.icon}</div><div class="zonecopy"><b>${x.name}</b><small>${state.done.filter(n=>MISSIONS[n].zone===i).length}/${x.to-x.from}</small></div>${state.done.filter(n=>MISSIONS[n].zone===i).length===x.to-x.from?'<span class="tick">✓</span>':''}</div>`).join('');z.querySelectorAll('[data-zone]').forEach(el=>el.onclick=()=>{let i=+el.dataset.zone;if(!zoneUnlocked(i)){toast('Clear earlier missions to unlock this sector.');return;}activeZone=i;view='learn';render();});}
function navActive(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
function render(){updateStats();drawZones();navActive();const main=document.getElementById('main');if(view==='home')main.innerHTML=homeHTML();else if(view==='learn')main.innerHTML=learnHTML();else if(view==='sandbox')main.innerHTML=sandboxHTML();else main.innerHTML=skillsHTML();wireView();}
function homeHTML(){const next=MISSIONS.findIndex((m,i)=>!state.done.includes(i));const pct=Math.round(state.done.length/MISSIONS.length*100);return `<section class="hero"><div class="eyebrow">Your next promotion starts with a query</div><h2>Think like an analyst.<br>Write SQL with confidence.</h2><p>Progress from first query to technical commercial leadership: model data, define trustworthy KPIs, investigate quality, assess production reliability and defend decisions with evidence. No prior SQL experience needed.</p><button class="button primary" data-action="continue">${next<0?'↻ Review the journey':'▶ Continue your quest'}</button> <span class="tag">${pct}% journey complete</span></section><div class="grid2"><div><section class="panel"><div class="panelhead"><div><h3>🗺️ Your learning path</h3><div class="sub">Small missions, steadily harder SQL</div></div><span class="tag">${state.done.length}/${MISSIONS.length}</span></div><div class="missionlist">${ZONES.map((z,i)=>{let count=state.done.filter(n=>MISSIONS[n].zone===i).length,tot=z.to-z.from,locked=!zoneUnlocked(i);return `<div class="mission ${activeZone===i?'current':''} ${count===tot?'done':''} ${locked?'locked':''}" data-zone="${i}"><div class="missionnum">${count===tot?'✓':z.icon}</div><div class="missioninfo"><b>${z.name}</b><small>${z.desc}</small></div><div class="missionright">${count}/${tot}<br><small>${locked?'🔒 locked':count===tot?'cleared':'open'}</small></div></div>`}).join('')}</div></section><section class="panel"><div class="panelhead"><div><h3>⚡ Quick warm-up</h3><div class="sub">One minute to get your hands moving</div></div></div><p class="sub">In the SQL sandbox, try asking the database a question you already know how to answer in plain English.</p><button class="button" data-action="sandbox">Open the sandbox →</button></section></div><div><section class="panel"><div class="panelhead"><div><h3>🎯 Next mission</h3><div class="sub">Pick up where you left off</div></div><span class="tag gold">+50 XP</span></div>${next<0?'<p>All missions cleared. Revisit a skill or use the sandbox to invent your own questions.</p>':`<div class="concept"><b>${esc(MISSIONS[next].title)}</b><p>${esc(MISSIONS[next].concept)}</p></div><p class="sub">${esc(MISSIONS[next].task)}</p><button class="button primary" data-action="mission" data-id="${next}">Start mission →</button>`}</section><section class="panel"><h3>🧠 Confidence is built by retrieval</h3><p class="sub">For each mission, try it yourself first, use a hint if stuck, explain why the query works, then repeat it later without looking.</p><div class="divider"></div><div class="skillrow"><span>Mission progress</span><div class="skillbar"><i style="width:${pct}%"></i></div><b>${pct}%</b></div><div class="skillrow"><span>SQL practice</span><div class="skillbar"><i style="width:${Math.min(100,state.views*4)}%"></i></div><b>${state.views}</b></div></section></div></div>`;}
function learnHTML(){let z=ZONES[activeZone],items=MISSIONS.map((m,i)=>({m,i})).filter(x=>x.m.zone===activeZone);if(current<z.from||current>=z.to)current=items.find(x=>!state.done.includes(x.i))?.i??z.from;let m=MISSIONS[current];return `<section class="panel"><div class="panelhead"><div><div class="eyebrow">${z.icon} SECTOR ${activeZone+1} OF ${ZONES.length}</div><h3>${z.name}</h3><div class="sub">${z.desc}</div></div><span class="tag">${items.filter(x=>state.done.includes(x.i)).length}/${items.length} cleared</span></div><div class="missionlist">${items.map(({m:x,i})=>`<div class="mission ${current===i?'current':''} ${state.done.includes(i)?'done':''} ${!isMissionOpen(i)?'locked':''}" data-mission="${i}"><div class="missionnum">${state.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</div><div class="missioninfo"><b>${esc(x.title)}</b><small>${esc(x.skill.toUpperCase())}</small></div><div class="missionright">${state.done.includes(i)?'CLEARED':'+50 XP'}</div></div>`).join('')}</div></section>${missionHTML(m,current)}`;}
function isMissionOpen(i){return i===0||state.done.includes(i)||state.done.includes(i-1)||MISSIONS[i].zone===0;}
function missionHTML(m,i){return `<section class="panel" id="missionPanel"><div class="lessonhead"><div><div class="eyebrow">MISSION ${String(i+1).padStart(2,'0')} · ${m.skill.toUpperCase()}</div><h2>${esc(m.title)}</h2><p>Learn the pattern, solve the brief, then explain what your query tells you.</p></div><span class="tag gold">+50 XP</span></div><div class="concept"><b>💡 The idea</b><p>${esc(m.concept)}</p></div><div class="task"><strong>📋 Your brief</strong><p>${esc(m.task)}</p></div><div class="sub">Example pattern</div><pre style="white-space:pre-wrap;background:#10172a;padding:10px 12px;border-radius:10px;color:#c5e9ff;font:12px/1.6 ui-monospace,monospace;overflow:auto">${esc(m.ex)}</pre><div class="editor"><div class="editorbar"><div class="dots"><i></i><i></i><i></i></div><span>query.sql</span><button class="button small ghost" id="formatBtn">Reset editor</button></div><textarea id="sql" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Write your SQL query">${esc(m.solution)}</textarea><div class="editorfooter"><small>Tip: use single quotes around text values.</small><button class="button primary" id="runBtn">▶ Run & check</button></div></div><div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="button small" id="hintBtn">💡 Hint (${hintLevel}/2)</button><button class="button small" id="showAnswerBtn">Show solution</button><button class="button small" id="schemaBtn">🗂 Browse tables</button></div><div id="hintArea"></div><div id="resultArea"></div><div class="notice">Real confidence check: a green tick means your result matches the expected answer on this training dataset. In real work, also validate assumptions and edge cases.</div></section>`;}
function sandboxHTML(){return `<section class="hero"><div class="eyebrow">Open practice area</div><h2>The database is yours.</h2><p>Explore the retail dataset, test ideas, break things safely and write your own questions. The sandbox does not award mission XP, so experiment freely.</p></section><section class="panel"><div class="sandboxintro"><div><h3>⌨️ SQL sandbox</h3><div class="sub">Read-only SELECT practice · AlaSQL browser engine</div></div><span class="tag green">Training database</span></div><div class="tablelist" style="margin:14px 0">${Object.keys(TABLES).map(t=>`<button class="tablechip" data-table="${t}">${t}</button>`).join('')}</div><div class="editor"><div class="editorbar"><div class="dots"><i></i><i></i><i></i></div><span>scratch.sql</span><button class="button small ghost" id="sandboxExample">Load example</button></div><textarea id="sql" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Write a SQL query">SELECT p.team, SUM(s.units) AS units\nFROM sales s\nJOIN products p ON p.id = s.product_id\nGROUP BY p.team\nORDER BY units DESC;</textarea><div class="editorfooter"><small>Tip: start with SELECT and FROM.</small><button class="button primary" id="runBtn">▶ Run query</button></div></div><div id="resultArea"></div><div class="notice">For safety, this sandbox is intended for SELECT queries and common read-only SQL. Progress saves in this browser on this device.</div></section><section class="panel"><h3>🗂 Table explorer</h3><p class="sub">Tap a table to inspect its columns and preview rows.</p><div id="schemaDetail" class="schema"></div></section>`;}
function skillsHTML(){const completed=state.done.length;return `<section class="hero"><div class="eyebrow">Your progress report</div><h2>Proof of practice.</h2><p>Track the skills you have trained and the challenges you have cleared. XP rewards consistency; competence comes from being able to explain and adapt the query.</p></section><div class="grid2"><section class="panel"><div class="panelhead"><div><h3>📊 Skill map</h3><div class="sub">A skill improves as you clear relevant missions</div></div></div>${SKILLS.map(([id,name])=>{let ms=MISSIONS.filter(m=>m.skill===id),n=MISSIONS.filter((m,i)=>m.skill===id&&state.done.includes(i)).length,p=ms.length?Math.round(n/ms.length*100):0;return `<div class="skillrow"><span>${name}</span><div class="skillbar"><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}<div class="divider"></div><p class="sub">Suggested standard: clear a mission, then redo it later from a blank editor without hints. Try explaining each clause aloud.</p></section><section class="panel"><div class="panelhead"><div><h3>🏅 Trophies</h3><div class="sub">Earned through meaningful practice</div></div><span class="tag">${earnedBadges().length}/6</span></div><div class="achievementgrid">${BADGES.map(b=>`<div class="badgecard ${b.check()?'earned':''}"><div class="medal">${b.icon}</div><b>${b.name}</b><small>${b.desc}</small></div>`).join('')}</div></section></div><section class="panel"><div class="panelhead"><div><h3>📌 Your next best move</h3><div class="sub">A useful routine for building real confidence</div></div></div><ol class="sub" style="padding-left:22px;line-height:1.9"><li>Read the business question and say what the output should contain.</li><li>Identify the table(s), row filters and required metric.</li><li>Write the query from memory before opening a hint.</li><li>Check the result: row count, nulls, duplicates and whether the number makes sense.</li><li>Explain the result and its limitations as if speaking to a buying or finance stakeholder.</li></ol><button class="button" data-action="learn">Return to learning path →</button></section><section class="panel"><div class="panelhead"><div><h3>🔁 Personal review queue</h3><div class="sub">Missions that have produced an incorrect result or SQL error. Revisit them from a blank editor.</div></div><span class="tag">${Object.keys(state.mistakes||{}).filter(k=>state.mistakes[k]>0).length} to review</span></div>${Object.keys(state.mistakes||{}).filter(k=>state.mistakes[k]>0).sort((a,b)=>(state.mistakes[b]||0)-(state.mistakes[a]||0)).slice(0,8).map(k=>`<div class="mission"><div class="missionnum">↻</div><div class="missioninfo"><b>${esc(MISSIONS[+k].title)}</b><small>${state.mistakes[k]} failed attempt${state.mistakes[k]===1?'':'s'} · ${state.done.includes(+k)?'cleared; try again from memory':'not cleared yet'}</small></div><button class="button small" data-action="mission" data-id="${k}">Review →</button></div>`).join('')||'<p class="sub">No review items yet. When a query fails, it will appear here automatically.</p>'}</section><section class="panel"><div class="panelhead"><div><h3>🎖️ Technical commercial leader checklist</h3><div class="sub">Use these as interview and on-the-job standards—not just topics to memorise.</div></div></div><div class="schema"><div class="schemaitem"><b>Model the business correctly</b><p>Explain table grain, keys, relationships, slowly changing attributes, fact/dimension design and how join fan-out inflates metrics.</p></div><div class="schemaitem"><b>Build trusted metrics</b><p>Define numerator, denominator, grain, date window, exclusions, returns/cancellations, currency, discount and margin assumptions.</p></div><div class="schemaitem"><b>Diagnose data issues</b><p>Use null/duplicate/orphan checks, source-to-target reconciliation, freshness, exception queues and impact-based prioritisation.</p></div><div class="schemaitem"><b>Ship reliable data products</b><p>Discuss SQL dialects, query plans, indexes, incremental loads, idempotency, tests, monitoring, SLAs, lineage and recovery.</p></div><div class="schemaitem"><b>Lead through trade-offs</b><p>Explain privacy and access boundaries, source limitations, cost versus freshness, build versus buy, adoption measures and ownership.</p></div></div></section>`;}
const BADGES=[{name:'First Query',icon:'🟣',desc:'Clear 1 mission',check:()=>state.done.length>=1},{name:'Filter Finder',icon:'🔎',desc:'Clear filtering sector',check:()=>[4,5,6,7].every(i=>state.done.includes(i))},{name:'Group Thinker',icon:'🧮',desc:'Clear aggregation sector',check:()=>[8,9,10,11].every(i=>state.done.includes(i))},{name:'Join Force',icon:'🔗',desc:'Clear join sector',check:()=>[12,13,14,15].every(i=>state.done.includes(i))},{name:'Data Guardian',icon:'🧹',desc:'Clear quality missions',check:()=>[22,23].every(i=>state.done.includes(i))},{name:'Boardroom Ready',icon:'🏆',desc:'Clear every mission',check:()=>state.done.length===MISSIONS.length}];function earnedBadges(){return BADGES.filter(b=>b.check());}
function wireView(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});document.querySelectorAll('[data-zone]').forEach(el=>el.onclick=()=>{let i=+el.dataset.zone;if(!zoneUnlocked(i)){toast('Clear earlier missions to unlock this sector.');return;}activeZone=i;view='learn';current=ZONES[i].from;hintLevel=0;render();});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='continue'){let n=MISSIONS.findIndex((m,i)=>!state.done.includes(i));if(n<0)n=0;openMission(n);}else if(a==='mission')openMission(+b.dataset.id);else if(a==='sandbox'){view='sandbox';render();}else if(a==='learn'){view='learn';render();}});document.querySelectorAll('[data-mission]').forEach(el=>el.onclick=()=>{let i=+el.dataset.mission;if(!isMissionOpen(i)){toast('Clear the previous mission first to unlock this one.');return;}openMission(i);});const run=document.getElementById('runBtn');if(run)run.onclick=()=>runQuery();const fmt=document.getElementById('formatBtn');if(fmt)fmt.onclick=()=>{document.getElementById('sql').value=MISSIONS[current].solution;toast('Mission query reset.');};const hint=document.getElementById('hintBtn');if(hint)hint.onclick=showHint;const ans=document.getElementById('showAnswerBtn');if(ans)ans.onclick=()=>{document.getElementById('sql').value=MISSIONS[current].solution;hintLevel=2;showHint();toast('Solution loaded — run it, then try again from memory.');};const schema=document.getElementById('schemaBtn');if(schema)schema.onclick=()=>{document.getElementById('hintArea').innerHTML=schemaHTML();};const ex=document.getElementById('sandboxExample');if(ex)ex.onclick=()=>document.getElementById('sql').value='SELECT category, COUNT(*) AS products\nFROM products\nGROUP BY category\nORDER BY products DESC;';document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{document.getElementById('sql').value='SELECT * FROM '+b.dataset.table+' LIMIT 10;';runQuery();const d=document.getElementById('schemaDetail');if(d)d.innerHTML=tableSchema(b.dataset.table);});if(view==='sandbox'){const d=document.getElementById('schemaDetail');if(d)d.innerHTML=Object.keys(TABLES).map(tableSchema).join('');}}
function openMission(i){current=i;activeZone=MISSIONS[i].zone;view='learn';hintLevel=0;solvedCurrent=false;lastResult=null;render();setTimeout(()=>{const p=document.getElementById('missionPanel');if(p&&window.innerWidth<650)p.scrollIntoView({behavior:'smooth',block:'start'});},30);}
function showHint(){const m=MISSIONS[current];if(hintLevel<2)hintLevel++;const h=document.getElementById('hintArea');if(h)h.innerHTML=`<div class="hintbox"><b>Hint ${hintLevel} of 2</b><p>${esc(m.hint[hintLevel-1])}</p>${hintLevel===2?'<p class="tip">Still stuck? Use Show solution, run it, then close the answer and rebuild it from memory.</p>':''}</div>`;const b=document.getElementById('hintBtn');if(b)b.textContent='💡 Hint ('+hintLevel+'/2)';}
function runQuery(){const box=document.getElementById('sql'),area=document.getElementById('resultArea');if(!box||!area)return;let sql=box.value.trim();state.views++;save();if(!sql){area.innerHTML='<div class="feedback error"><h4>Write a query first</h4><p>Start with SELECT and FROM, then run it.</p></div>';return;}if(!window.alasql){area.innerHTML='<div class="feedback error"><h4>SQL engine did not load</h4><p>This file needs an internet connection to load the AlaSQL library. Open it online or refresh with connectivity.</p></div>';return;}if(view==='sandbox'&&!/^\s*(SELECT|WITH)\b/i.test(sql)){area.innerHTML='<div class="feedback error"><h4>Sandbox is read-only</h4><p>Use SELECT queries only. This protects the training dataset.</p></div>';return;}try{const result=alasql(sql.replace(/;\s*$/,''));if(!Array.isArray(result)){area.innerHTML='<div class="feedback"><h4>Query executed</h4><p>This command did not return a row grid. Try a SELECT statement to inspect data.</p></div>';return;}lastResult=result;if(view==='learn'){const expected=alasql(MISSIONS[current].solution.replace(/;\s*$/,''));const ok=compareRows(result,expected);if(ok){const first=!state.done.includes(current);if(first){state.done.push(current);state.done.sort((a,b)=>a-b);state.xp+=50;state.runStreak++;state.perfect++;state.streak++;save();updateStats();drawZones();}solvedCurrent=true;area.innerHTML=`<div class="feedback success"><h4>✓ Mission cleared ${first?'· +50 XP':'· already cleared'}</h4><p>${esc(MISSIONS[current].why)}</p><p><b>Analyst habit:</b> Can you explain what each clause contributes, and one limitation of this result?</p></div>${resultHTML(result)}<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="button primary" id="nextMission">${current===MISSIONS.length-1?'🎉 Review skills':'Next mission →'}</button><button class="button" id="retryMission">Try from memory</button></div>`;document.getElementById('nextMission').onclick=()=>{if(current===MISSIONS.length-1){view='skills';render();}else openMission(Math.min(current+1,MISSIONS.length-1));};document.getElementById('retryMission').onclick=()=>{box.value='';area.innerHTML='';solvedCurrent=false;box.focus();};toast(first?'+50 XP · mission cleared!':'Correct query!');}else{state.runStreak=0;if(view==='learn')recordMistake(current);save();area.innerHTML=`<div class="feedback error"><h4>Good attempt — compare your output with the brief</h4><p>Your SQL ran, so syntax is working. The returned columns or rows don't yet match the task.</p><p><b>Try:</b> ${esc(MISSIONS[current].hint[Math.min(hintLevel,1)])}</p></div>${resultHTML(result)}<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="button small" id="hintAfter">💡 Give me a hint</button></div>`;document.getElementById('hintAfter').onclick=showHint;}}else{area.innerHTML=`<div class="feedback success"><h4>Query returned ${result.length} row${result.length===1?'':'s'}</h4><p>Read the column names and spot-check the values. A query running successfully does not automatically mean the business answer is correct.</p></div>${resultHTML(result)}`;}}catch(e){state.runStreak=0;if(view==='learn')recordMistake(current);save();area.innerHTML=`<div class="feedback error"><h4>SQL error</h4><p>${esc(e.message||String(e))}</p><p><b>Debug checklist:</b> check spelling, commas, quotes, table names and whether every column exists in the table.</p></div>`;}}
function compareRows(a,b){if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return false;const norm=x=>JSON.stringify(Object.keys(x).sort().map(k=>[k,String(x[k]===undefined?'':x[k]===null?'NULL':typeof x[k]==='number'?Number(x[k].toFixed(5)):x[k])]));const aa=a.map(norm).sort(),bb=b.map(norm).sort();return aa.every((v,i)=>v===bb[i]);}
function resultHTML(rows){if(!rows||!rows.length)return '<div class="resultwrap"><div class="empty">Query returned 0 rows.</div></div>';const cols=Object.keys(rows[0]);return `<div class="resultwrap"><table class="result"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr>${cols.map(c=>`<td>${r[c]===null?'<span class="null">NULL</span>':esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tablepreview">${rows.length>100?'Showing first 100 rows · ':''}<strong>${rows.length}</strong> row${rows.length===1?'':'s'} returned</div>`;}
function schemaHTML(){return `<div class="schema">${Object.keys(TABLES).map(tableSchema).join('')}</div>`;}
function tableSchema(t){if(!TABLES[t])return '';const rows=TABLES[t],cols=Object.keys(rows[0]||{});return `<div class="schemaitem"><b>${esc(t)}</b><p>${esc(TABLEDESC[t]||'Training table')}</p><p><strong>Columns:</strong> ${cols.map(esc).join(' · ')}</p><button class="button small" data-table="${esc(t)}">Preview rows</button></div>`;}
document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all XP, mission progress and trophies on this device? This cannot be undone.')){state={xp:0,done:[],streak:0,last:'',runStreak:0,perfect:0,views:0,mistakes:{}};save();current=0;activeZone=0;view='home';render();toast('Progress reset. Fresh start!');}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.getElementById('sql')){e.preventDefault();runQuery();}});
initDB();render();
})();
</script>
</body>
</html>
