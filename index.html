{g:'Read it like a sentence: SELECT these columns FROM this table. Separate columns with commas, but no comma after the last one.',x:[["SELECT * FROM customers",'* means every column. Ideal for a first look at a table.'],["SELECT name, stock AS in_stock FROM products",'AS renames a column in the output only.']],m:'A trailing comma before FROM is the classic syntax error.'},
{g:'Say the condition in plain English first, then translate. Text needs quotes, numbers do not. Use parentheses when mixing AND with OR.',x:[["SELECT name, team FROM products WHERE stock = 0",'Numbers need no quotes. Finds out-of-stock items.'],["SELECT name, price FROM products WHERE (team = 'Team Rocket' OR team = 'Team Valor') AND price > 20",'Parentheses make the OR happen first.']],m:'Forgetting quotes around text, or using == instead of =.'},
{g:'Order of work: filter, then sort, then cut with LIMIT. To sort by two things, list both.',x:[["SELECT name, team, price FROM products ORDER BY category, price DESC",'Category A to Z, then price high to low inside each category.'],["SELECT name, stock FROM products ORDER BY stock ASC LIMIT 2",'The two lowest stock levels.']],m:'LIMIT without ORDER BY gives arbitrary rows, so sort first.'},
{g:'Use IN instead of a chain of ORs, BETWEEN for ranges (both ends included), LIKE for patterns.',x:[["SELECT name, team FROM products WHERE team LIKE 'Man%'",'Starts with Man.'],["SELECT name, price FROM products WHERE name LIKE '%Shirt%'",'Contains Shirt anywhere.']],m:'BETWEEN 15 AND 30 includes 15 and 30.'},
{g:'NULL means unknown, not zero or empty text. Any comparison with NULL, even = NULL, is never true.',x:[["SELECT name FROM products WHERE team IS NOT NULL",'Leaves out products with no team.'],["SELECT name, country FROM customers WHERE country <> 'UK'",'Fatima (NULL country) is not returned: NULL fails every comparison.']],m:'WHERE country = NULL returns nothing. Use IS NULL.'},
{g:'Aggregates turn many rows into one summary row. With no GROUP BY, the whole table is one group.',x:[["SELECT MIN(price) AS cheapest, MAX(price) AS dearest FROM products",'Several aggregates at once.'],["SELECT SUM(stock) AS units_in_stock FROM products WHERE category = 'Shirt'",'WHERE filters first, then SUM adds up what is left.']],m:'COUNT(col) skips NULLs but COUNT(*) counts every row.'},
{g:'Rule: every column in SELECT is either inside an aggregate or listed in GROUP BY.',x:[["SELECT team, SUM(stock) AS units FROM products GROUP BY team",'One row per team (NULL gets its own group).'],["SELECT category, ROUND(AVG(price),2) AS avg_price FROM products GROUP BY category ORDER BY avg_price DESC",'Group first, then sort the groups.']],m:'Selecting a plain column that is not in GROUP BY.'},
{g:'Ask: am I filtering raw rows (WHERE) or a calculated group result (HAVING)? You can use both in one query.',x:[["SELECT customer_id, SUM(qty) AS items FROM orders GROUP BY customer_id HAVING SUM(qty) >= 4",'Customers who bought 4 or more items.'],["SELECT team, COUNT(*) AS n FROM products WHERE price > 20 GROUP BY team HAVING COUNT(*) >= 2",'WHERE trims rows first, HAVING trims groups after.']],m:'Putting an aggregate like COUNT(*) inside WHERE.'},
{g:'Start FROM one table, then JOIN each related table through its key (orders.customer_id matches customers.id). Always include ON.',x:[["SELECT o.id, p.name, p.team, o.qty FROM orders o JOIN products p ON p.id = o.product_id",'Each order line with its product details.'],["SELECT c.name, o.order_date FROM customers c JOIN orders o ON o.customer_id = c.id WHERE c.country = 'UK'",'Join, then filter on a joined column.']],m:'Joining on the wrong columns multiplies rows.'},
{g:'Build in steps: join and check the rows with SELECT *, then add the calculation, then add GROUP BY.',x:[["SELECT o.id, p.name, o.qty * p.price AS line_total FROM orders o JOIN products p ON p.id = o.product_id",'Line total per order, no grouping yet.'],["SELECT p.team, SUM(o.qty) AS units FROM orders o JOIN products p ON p.id = o.product_id GROUP BY p.team",'Units sold per team.']],m:'Ambiguous columns: prefix with the alias (o.id, c.id).'},
{g:'LEFT JOIN keeps every row from the first table. Unmatched rows get NULLs on the right, so IS NULL on a right-side key finds the missing matches.',x:[["SELECT c.name, o.id AS order_id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE c.id IN (6,8)",'Hana (id 8) shows up with a NULL order.'],["SELECT c.name, COUNT(o.id) AS n FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.name",'COUNT(o.id) gives 0 for no orders; COUNT(*) would wrongly give 1.']],m:'Filtering the right table in WHERE turns a LEFT JOIN into a normal JOIN.'},
{g:'Write the inner query alone first and check it works, then wrap it in parentheses inside the outer query.',x:[["SELECT AVG(price) AS avg_price FROM products",'Step 1: the inner query by itself.'],["SELECT name FROM products WHERE id IN (SELECT product_id FROM orders)",'A subquery returning a list: products that have been ordered.']],m:'A subquery used with > or = must return a single value.'},
{g:'CASE checks top to bottom and stops at the first match, so order the tests carefully.',x:[["SELECT name, CASE WHEN stock = 0 THEN 'Out' WHEN stock < 20 THEN 'Low' ELSE 'OK' END AS status FROM products",'Stock status labels.'],["SELECT SUM(CASE WHEN category = 'Shirt' THEN stock ELSE 0 END) AS shirt_stock, SUM(CASE WHEN category <> 'Shirt' THEN stock ELSE 0 END) AS other_stock FROM products",'CASE inside SUM gives conditional totals (a pivot).']],m:'Forgetting END.'}

{t:'DISTINCT and unique counts',e:'<code>DISTINCT</code> removes duplicate rows. <code>COUNT(DISTINCT col)</code> counts unique values.',g:'Ask: do I want every row, or each unique value once? COUNT(customer_id) on orders counts order lines, not people.',x:[["SELECT DISTINCT team FROM products",'Each team listed once.'],["SELECT COUNT(*) AS lines, COUNT(DISTINCT customer_id) AS buyers FROM orders",'16 order lines but fewer unique buyers.']],m:'Using COUNT(*) when you meant unique entities.',k:'Return the number of unique customers who have placed an order, as buyers.',s:'SELECT COUNT(DISTINCT customer_id) AS buyers FROM orders',h:'COUNT(DISTINCT customer_id)'},
{t:'COALESCE and text functions',e:'<code>COALESCE(a, b)</code> returns the first value that is not NULL. <code>UPPER</code>, <code>LOWER</code> and <code>LENGTH</code> work on text.',g:'Use COALESCE to make NULLs readable in reports, or to supply defaults before doing maths.',x:[["SELECT name, COALESCE(team,'No team') AS team FROM products WHERE category = 'Ball'",'Swaps NULL for a label.'],["SELECT UPPER(name) AS shout, LENGTH(name) AS chars FROM customers",'Text functions apply to every row.']],m:'NULL + 5 is NULL, so wrap nullable numbers in COALESCE(col, 0).',k:"Show name and country for every customer, replacing a missing country with 'Unknown'.",s:"SELECT name, COALESCE(country,'Unknown') AS country FROM customers",h:"COALESCE(country,'Unknown')"},
{t:'Dates and monthly reporting',e:'Dates here are text like <code>2025-10-14</code>, which sorts correctly. <code>SUBSTRING(text, start, length)</code> slices it.',g:'Trimming to the first 7 characters gives year-month, a handy group key. In Snowflake you would use DATE_TRUNC(\'month\', order_date) instead.',x:[["SELECT SUBSTRING(order_date,1,7) AS ym, order_date FROM orders WHERE id < 4",'First 7 characters are the year and month.'],["SELECT order_date, COUNT(*) AS n FROM orders GROUP BY order_date ORDER BY order_date",'Orders per day.']],m:'Grouping by the full date when you wanted the month.',k:'Show each year-month as ym with the number of orders as n.',s:'SELECT SUBSTRING(order_date,1,7) AS ym, COUNT(*) AS n FROM orders GROUP BY SUBSTRING(order_date,1,7)',h:'GROUP BY SUBSTRING(order_date,1,7)'},
{t:'Subqueries in FROM',e:'A query in the FROM clause acts like a temporary table. Use it to aggregate, then aggregate again.',g:'Build the inner summary first and run it alone. Then SELECT from it with an alias such as t.',x:[["SELECT t.team, t.units FROM (SELECT p.team, SUM(o.qty) AS units FROM orders o JOIN products p ON p.id = o.product_id GROUP BY p.team) t WHERE t.units > 5",'Inner query summarises, outer query filters.'],["SELECT MAX(t.n) AS busiest FROM (SELECT order_date, COUNT(*) AS n FROM orders GROUP BY order_date) t",'An aggregate of an aggregate.']],m:'Forgetting the alias after the closing bracket.',k:"Return the average total spend per buying customer, rounded to 2 decimals, as avg_spend.",s:'SELECT ROUND(AVG(t.revenue),2) AS avg_spend FROM (SELECT o.customer_id, SUM(o.qty * p.price) AS revenue FROM orders o JOIN products p ON p.id = o.product_id GROUP BY o.customer_id) t',h:'Inner: SUM(o.qty * p.price) per customer_id. Outer: ROUND(AVG(t.revenue),2).'},
{t:'IN and NOT IN subqueries',e:'Filter one table by values found in another, without joining it.',g:'Phrase it as: rows whose key appears in (or is missing from) a list produced by another query.',x:[["SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders WHERE qty >= 3)",'Customers who ever ordered 3 or more of an item.'],["SELECT name, team FROM products WHERE id NOT IN (SELECT product_id FROM orders)",'Products never ordered.']],m:'NOT IN returns nothing if the list contains a NULL.',k:'Show the name of customers who have bought a Team Rocket product.',s:"SELECT name FROM customers WHERE id IN (SELECT o.customer_id FROM orders o JOIN products p ON p.id = o.product_id WHERE p.team = 'Team Rocket')",h:'Inner query: join orders to products, filter team, select customer_id.'},
{t:'Top-N analysis',e:'Real questions combine everything: join, group, sort, limit.',g:'Say it in steps: which rows, grouped by what, measured how, sorted how, how many.',x:[["SELECT p.category, SUM(o.qty * p.price) AS revenue FROM orders o JOIN products p ON p.id = o.product_id GROUP BY p.category ORDER BY revenue DESC",'Revenue by category.'],["SELECT c.country, COUNT(*) AS n FROM orders o JOIN customers c ON c.id = o.customer_id GROUP BY c.country ORDER BY n DESC LIMIT 2",'Top 2 countries by order lines.']],m:'Ties can make LIMIT cut off equal rows.',k:'Show the name, team and total units sold (as units) of the single best-selling product.',s:'SELECT p.name, p.team, SUM(o.qty) AS units FROM orders o JOIN products p ON p.id = o.product_id GROUP BY p.name, p.team ORDER BY units DESC LIMIT 1',h:'Join, GROUP BY p.name, p.team, ORDER BY units DESC LIMIT 1'},
{t:'Changing data',r:1,e:'<code>INSERT</code>, <code>UPDATE</code> and <code>DELETE</code> modify tables. Try them, then run a SELECT to see the effect. Use Reset data to restore the tables.',g:'Write the WHERE clause first for UPDATE and DELETE. Without it they hit every row. In real databases, test with a SELECT using the same WHERE.',x:[["INSERT INTO customers VALUES (9,'Ivy','UK','2025-10-18')",'Adds a row. Values follow column order.'],["UPDATE products SET stock = stock + 10 WHERE id = 4",'Restocks one product.'],["DELETE FROM orders WHERE id = 16",'Removes one order.']],m:'Running UPDATE or DELETE with no WHERE.'},
{t:'Next level: CTEs and windows',r:1,nr:1,e:'These need a full database such as Snowflake, so they are read-only here. Copy them into your own worksheet.',g:'A CTE (WITH) names a query so later steps read top to bottom. Window functions calculate across related rows without collapsing them.',x:[["WITH team_sales AS (\n SELECT p.team, SUM(o.qty * p.price) AS revenue\n FROM orders o JOIN products p ON p.id = o.product_id\n GROUP BY p.team)\nSELECT * FROM team_sales WHERE revenue > 500",'CTE: a named step you can reuse.'],["SELECT name, team, price,\n RANK() OVER (PARTITION BY team ORDER BY price DESC) AS rank_in_team\nFROM products",'Window: rank within each team, keeping every row.'],["SELECT name, team, price FROM products\nQUALIFY ROW_NUMBER() OVER (PARTITION BY team ORDER BY price DESC) = 1",'Snowflake QUALIFY filters on a window result: priciest product per team.']],m:'Using a window function in WHERE; use QUALIFY or a CTE instead.'}
];
var MORE=[
{t:'Excel to SQL cheat sheet',r:1,e:'Everything you do in Excel has a SQL equivalent:<pre>Sort               ORDER BY\nFilter             WHERE\nVLOOKUP / XLOOKUP  JOIN\nSUMIF / COUNTIF    SUM / COUNT + WHERE\nPivot table        GROUP BY (+ CASE)\nIF / IFS           CASE WHEN\nRemove duplicates  DISTINCT\nIFERROR / blanks   COALESCE\nLEFT / LEN         SUBSTRING / LENGTH</pre>',g:'A table is a sheet where every column has one type. The big shift: you describe the result you want, not the steps to build it.',x:[[`SELECT o.id, p.name FROM orders o JOIN products p ON p.id = o.product_id WHERE o.id <= 5`,'VLOOKUP: pull the product name for each order.'],[`SELECT SUM(stock) AS total FROM products WHERE team = 'Team Rocket'`,'SUMIF.'],[`SELECT COUNT(*) AS n FROM orders WHERE qty >= 2`,'COUNTIF.']],m:'Expecting row order to be fixed. Without ORDER BY, order is not guaranteed.'},
{t:'Execution order and good habits',r:1,e:'SQL runs in this order, not the order you write it: FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.',g:'Habits of confident SQL users: peek with SELECT * ... LIMIT 5; build queries in small steps; qualify columns with aliases; sanity-check row counts after every join; format one clause per line; comment with -- .',x:[[`SELECT * FROM orders LIMIT 5`,'Always peek at a table first.'],[`SELECT COUNT(*) AS n FROM orders o JOIN products p ON p.id = o.product_id`,'Same as the orders row count (16), so the join neither duplicated nor dropped rows.']],m:'Using a SELECT alias inside WHERE. WHERE runs before SELECT, so repeat the expression.'},
{t:'JOIN types and fan-out traps',r:1,e:'<b>INNER</b> keeps matches only. <b>LEFT</b> keeps all left rows. <b>RIGHT</b> is the mirror. <b>FULL</b> keeps both sides. <b>CROSS</b> pairs every row with every row.',g:'Before joining, ask whether each side has one row per key. Joining to a table with many rows per key repeats rows and inflates SUMs. This is the most common cause of wrong numbers.',x:[[`SELECT SUM(stock) AS stock_total FROM products`,'The correct total.'],[`SELECT SUM(p.stock) AS inflated FROM products p JOIN orders o ON o.product_id = p.id`,'Inflated: each product repeats once per order line.'],[`SELECT c.name, p.name AS product FROM customers c CROSS JOIN products p WHERE c.id = 1 AND p.id < 4`,'CROSS JOIN: every combination.']],m:'Summing a column after a join that repeats rows. Aggregate first, then join.'}
];

{t:'Cleanup 1: profile messy data',e:'New table <code>raw_orders</code> (see Tables you can query). Every column is text, with duplicates, odd casing, stray spaces, blanks and bad values, like a real export.',g:'Never clean blindly. Profile first: row count, NULL count, distinct count. If DISTINCT is higher than expected you probably have casing or spacing variants.',x:[[`SELECT * FROM raw_orders`,'Scan the raw data and spot the problems by eye.'],[`SELECT status, COUNT(*) AS n FROM raw_orders GROUP BY status`,'The same status in different casing forms separate groups.']],m:'Assuming a blank cell is NULL. It may be empty text, which IS NULL will not find.',k:'Return the row count as n, the number of rows with an email as with_email, and the number of distinct raw email values as distinct_email.',s:'SELECT COUNT(*) AS n, COUNT(email) AS with_email, COUNT(DISTINCT email) AS distinct_email FROM raw_orders',h:'COUNT(*), COUNT(email), COUNT(DISTINCT email)'},
{t:'Cleanup 2: TRIM and case',e:'<code>TRIM</code> strips leading and trailing spaces. <code>LOWER</code> and <code>UPPER</code> fix case. Nest them: <code>LOWER(TRIM(col))</code>.',g:'Clean the same way everywhere you compare or group text, otherwise the same thing appears as several values.',x:[[`SELECT id, email, LOWER(TRIM(email)) AS clean_email FROM raw_orders WHERE id IN (1,2,6)`,'Before and after side by side.'],[`SELECT COUNT(DISTINCT LOWER(TRIM(email))) AS distinct_clean FROM raw_orders`,'Distinct emails drop from 8 to 7 once cleaned.']],m:'Comparing raw text: Poké Ball Keychain and poké ball keychain are different values to SQL.',k:'Show id and the cleaned email (trimmed, lower case) as email for rows that have an email.',s:'SELECT id, LOWER(TRIM(email)) AS email FROM raw_orders WHERE email IS NOT NULL',h:'LOWER(TRIM(email)) ... WHERE email IS NOT NULL'},
{t:'Cleanup 3: standardise categories',e:'Clean once in a derived table, then group on the cleaned column. Use CASE to turn blanks into a proper label.',g:'Pattern: inner query cleans, outer query summarises. Easier to debug than repeating expressions.',x:[[`SELECT id, status, CASE WHEN TRIM(status) = '' THEN 'unknown' ELSE LOWER(TRIM(status)) END AS clean_status FROM raw_orders WHERE id IN (3,8,13)`,'Blank becomes unknown, case is unified.'],[`SELECT LOWER(TRIM(product)) AS product, COUNT(*) AS n FROM raw_orders GROUP BY LOWER(TRIM(product))`,'Cleaned products grouped directly.']],m:'Treating empty text and NULL as the same thing without checking.',k:'Show each cleaned status (trimmed, lower case, empty text becomes unknown) as status, with the row count as n.',s:"SELECT status, COUNT(*) AS n FROM (SELECT CASE WHEN TRIM(status) = '' THEN 'unknown' ELSE LOWER(TRIM(status)) END AS status FROM raw_orders) t GROUP BY status",h:'Derived table with the CASE, then GROUP BY status'},
{t:'Cleanup 4: text to numbers',e:'<code>CAST(col AS NUMBER)</code> turns text into a number so you can add it up. Text such as N/A would break the maths, so filter it out first. (Snowflake: TRY_CAST returns NULL instead of failing.)',g:'Always look for bad values before aggregating: non-numeric text, negatives, blanks.',x:[[`SELECT id, amount, CAST(amount AS NUMBER) * 2 AS doubled FROM raw_orders WHERE id < 4`,'Maths works after the cast.'],[`SELECT id, amount FROM raw_orders WHERE amount = 'N/A' OR amount LIKE '-%'`,'Find bad or negative values before summing.']],m:'Summing text columns and trusting the answer.',k:'Return the total of all valid amounts (exclude N/A) as total.',s:"SELECT SUM(CAST(amount AS NUMBER)) AS total FROM raw_orders WHERE amount <> 'N/A'",h:"SUM(CAST(amount AS NUMBER)) ... WHERE amount <> 'N/A'"},
{t:'Cleanup 5: find duplicates',e:'Duplicates are rows repeating the same business key. Find them with GROUP BY and HAVING COUNT(*) > 1.',g:'Decide which columns define a duplicate. Rows 10 and 11 look identical but differ by a trailing space, so they escape a raw check. Clean first to catch them.',x:[[`SELECT product, COUNT(*) AS copies FROM raw_orders GROUP BY product HAVING COUNT(*) > 1`,'Raw product values that repeat.'],[`SELECT LOWER(TRIM(email)) AS email, order_date, COUNT(*) AS copies FROM raw_orders WHERE email IS NOT NULL GROUP BY LOWER(TRIM(email)), order_date HAVING COUNT(*) > 1`,'Duplicate candidates after cleaning.']],m:'Defining duplicates by too few columns and flagging genuine repeat orders.',k:'Show email, product and order_date of raw combinations appearing more than once, with the count as copies.',s:'SELECT email, product, order_date, COUNT(*) AS copies FROM raw_orders GROUP BY email, product, order_date HAVING COUNT(*) > 1',h:'GROUP BY email, product, order_date HAVING COUNT(*) > 1'},
{t:'Cleanup 6: remove duplicates',e:'Keep one row per duplicate group, usually the lowest id (the earliest). <code>MIN(id)</code> with GROUP BY gives the survivors.',g:'Select the ids to keep, then use them as a filter: WHERE id IN (SELECT MIN(id) ... GROUP BY ...). Never delete before you have checked the keep list.',x:[[`SELECT MIN(id) AS keep_id FROM raw_orders GROUP BY email, product, order_date`,'One id per raw duplicate group.'],[`SELECT * FROM raw_orders WHERE id IN (SELECT MIN(id) FROM raw_orders GROUP BY email, product, order_date)`,'The deduplicated table.']],m:'Deleting duplicates with no way to undo it. Create a new clean table instead.',k:'Show the ids to keep (lowest id per email, product, order_date combination) as id.',s:'SELECT MIN(id) AS id FROM raw_orders GROUP BY email, product, order_date',h:'MIN(id) ... GROUP BY email, product, order_date'},
{t:'Cleanup 7: fix mixed date formats',e:'Dates arrive as <code>2025-10-01</code> and as <code>02/10/2025</code> (DD/MM/YYYY). Detect the format, then rebuild with SUBSTRING and +.',g:'Test one character that differs between formats (a slash in position 3), then rearrange the parts. In Snowflake use TO_DATE with a format string.',x:[[`SELECT id, order_date FROM raw_orders WHERE SUBSTRING(order_date,3,1) = '/'`,'Rows in the DD/MM/YYYY format.'],[`SELECT SUBSTRING('02/10/2025',7,4) AS yr, SUBSTRING('02/10/2025',4,2) AS mth, SUBSTRING('02/10/2025',1,2) AS dy`,'The three pieces.']],m:'Mixing day-first and month-first dates: 02/10 is not the same everywhere.',k:'Show id and order_date converted to YYYY-MM-DD as iso_date for every row.',s:"SELECT id, CASE WHEN SUBSTRING(order_date,3,1) = '/' THEN SUBSTRING(order_date,7,4) + '-' + SUBSTRING(order_date,4,2) + '-' + SUBSTRING(order_date,1,2) ELSE order_date END AS iso_date FROM raw_orders",h:'CASE WHEN SUBSTRING(order_date,3,1) = slash THEN rebuild ELSE order_date END'},
{t:'Cleanup 8: put it together',e:'Real cleanup chains several steps: remove bad rows, standardise text, convert types, then aggregate.',g:'Work inside out: write the cleaning in a derived table, check it with SELECT *, then summarise it.',x:[[`SELECT LOWER(TRIM(product)) AS product, CAST(qty AS NUMBER) AS units FROM raw_orders WHERE LOWER(TRIM(status)) <> 'returned'`,'The cleaned rows before aggregating.']],m:'Summarising before checking the cleaned rows.',k:'Excluding returned orders (any casing), show cleaned product (trimmed, lower case) and total qty as units.',s:"SELECT product, SUM(units) AS units FROM (SELECT LOWER(TRIM(product)) AS product, CAST(qty AS NUMBER) AS units FROM raw_orders WHERE LOWER(TRIM(status)) <> 'returned') t GROUP BY product",h:'Derived table cleans and filters, outer query SUMs'},
{t:'Cleanup toolkit in Snowflake',r:1,nr:1,e:'The same ideas with the functions you will use in Snowflake. Read-only here.',g:'TRY_CAST for safe conversion, NULLIF to turn blanks into NULL, ILIKE for case-insensitive matching, QUALIFY for dedupe.',x:[[`SELECT TRY_TO_NUMBER(amount) AS amount_num, NULLIF(TRIM(status), '') AS status FROM raw_orders`,'Bad numbers become NULL, blanks become NULL.'],[`SELECT * FROM raw_orders\nQUALIFY ROW_NUMBER() OVER (PARTITION BY LOWER(TRIM(email)), product, order_date ORDER BY id) = 1`,'One-line dedupe keeping the earliest row.'],[`SELECT TO_DATE(order_date, 'DD/MM/YYYY') AS d FROM raw_orders WHERE order_date LIKE '%/%'`,'Proper date conversion.']],m:'Casting inside a WHERE and hoping the bad rows are filtered first. Use TRY_ functions.'},
{t:'SQL cheat sheet',r:1,nr:1,e:'<pre>SELECT cols FROM t\nJOIN t2 ON t.k = t2.k\nWHERE row filter\nGROUP BY cols\nHAVING group filter\nORDER BY col DESC\nLIMIT n</pre>',g:'Filtering: = <> < > BETWEEN IN LIKE IS NULL. Aggregates: COUNT SUM AVG MIN MAX. Logic: CASE WHEN. Text: TRIM LOWER UPPER SUBSTRING LENGTH. Nulls: COALESCE. Types: CAST. Sets: DISTINCT. Subqueries: IN, FROM, scalar. Writing: INSERT UPDATE DELETE.',x:[[`-- exploration habit\nSELECT * FROM table_name LIMIT 10;\nSELECT COUNT(*), COUNT(DISTINCT key_col) FROM table_name;`,'Run these on every new table.']],m:'Skipping the profiling step because the data looks fine.'}
];
var REV='s.units * p.price * (1 - s.discount_pct / 100.0)',SP='FROM sales s JOIN products p ON p.id = s.product_id';
var AN=[
{t:'Analytics 1: revenue from raw lines',e:'New tables: <code>sales</code> (150 sale lines with sale_date, store_id, product_id, units, discount_pct), <code>stores</code> (region, channel) and <code>targets</code> (monthly target per store, column period). Revenue is not stored: calculate units x price x (1 - discount_pct / 100.0).',g:'Commercial analysis starts with one agreed definition of revenue. Write it once, test it on a few rows, then reuse it everywhere.',x:[[`SELECT s.id, s.units, p.price, s.discount_pct, ROUND(${REV},2) AS revenue ${SP} WHERE s.id <= 5`,'Test the formula on a few rows first.'],[`SELECT COUNT(*) AS lines, SUM(s.units) AS units ${SP}`,'Volume checks before money.']],m:'Dividing by 100 instead of 100.0 can truncate in some databases.',k:'Return total revenue rounded to 2 decimals as revenue.',s:`SELECT ROUND(SUM(${REV}),2) AS revenue ${SP}`,h:'SUM of the revenue formula, then ROUND'},
{t:'Analytics 2: slice by region and channel',e:'Join the fact table (sales) to a dimension (stores) to slice revenue by who, where or what.',g:'Measure (revenue) plus dimensions (region, channel) in GROUP BY. This is the SQL version of a pivot table.',x:[[`SELECT st.channel, ROUND(SUM(${REV}),2) AS revenue ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.channel`,'One dimension.'],[`SELECT st.store, SUM(s.units) AS units ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.store ORDER BY units DESC`,'A different measure by store.']],m:'Joining the same table twice by accident, which doubles revenue.',k:'Show region, channel and revenue (2 decimals), highest revenue first.',s:`SELECT st.region, st.channel, ROUND(SUM(${REV}),2) AS revenue ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.region, st.channel ORDER BY revenue DESC`,h:'Join stores, GROUP BY region, channel'},
{t:'Analytics 3: monthly trend',e:'Trend reporting groups by a time bucket. Here the bucket is the first 7 characters of the date.',g:'Always ORDER BY the bucket so the trend reads left to right.',x:[[`SELECT SUBSTRING(s.sale_date,1,7) AS ym, SUM(s.units) AS units ${SP} GROUP BY SUBSTRING(s.sale_date,1,7) ORDER BY ym`,'Units per month.']],m:'Sorting by revenue and losing the time order.',k:'Show each year-month as ym with revenue (2 decimals) as revenue, in month order.',s:`SELECT SUBSTRING(s.sale_date,1,7) AS ym, ROUND(SUM(${REV}),2) AS revenue ${SP} GROUP BY SUBSTRING(s.sale_date,1,7) ORDER BY ym`,h:'GROUP BY SUBSTRING(s.sale_date,1,7) ORDER BY ym'},
{t:'Analytics 4: actual vs target',e:'Compare actuals to targets by summarising sales in a derived table, then LEFT JOIN it onto the targets.',g:'Start from the table that must keep all its rows (targets), so a store with no sales still appears with a zero.',x:[[`SELECT s.store_id, SUBSTRING(s.sale_date,1,7) AS period, ROUND(SUM(${REV}),2) AS actual ${SP} GROUP BY s.store_id, SUBSTRING(s.sale_date,1,7) ORDER BY s.store_id, period LIMIT 6`,'Step 1: actuals per store and month.']],m:'Joining raw sales to targets directly, which repeats each target once per sale.',k:'For period 2025-09 show store name, target, and actual revenue (2 decimals, 0 if none) as actual.',s:`SELECT st.store, t.target, ROUND(COALESCE(a.rev,0),2) AS actual FROM targets t JOIN stores st ON st.id = t.store_id LEFT JOIN (SELECT s.store_id, SUM(${REV}) AS rev ${SP} WHERE SUBSTRING(s.sale_date,1,7) = '2025-09' GROUP BY s.store_id) a ON a.store_id = t.store_id WHERE t.period = '2025-09'`,h:'Derived table of September revenue per store, LEFT JOINed to targets'},
{t:'Analytics 5: discount impact',e:'Segment sales into groups with CASE, then compare volume and revenue per group.',g:'Label rows in an inner query, summarise in the outer query.',x:[[`SELECT s.discount_pct, COUNT(*) AS lines, SUM(s.units) AS units ${SP} GROUP BY s.discount_pct ORDER BY s.discount_pct`,'Lines per discount level.']],m:'Comparing averages without checking the volumes behind them.',k:'Show price_type (Discounted if discount_pct > 0, otherwise Full price), total units as units and revenue (2 decimals) as revenue.',s:`SELECT price_type, SUM(units) AS units, ROUND(SUM(rev),2) AS revenue FROM (SELECT CASE WHEN s.discount_pct > 0 THEN 'Discounted' ELSE 'Full price' END AS price_type, s.units AS units, ${REV} AS rev ${SP}) t GROUP BY price_type`,h:'Inner query labels each line, outer query sums'},
{t:'Analytics 6: share of total',e:'Share of total = group value divided by overall value. A scalar subquery supplies the overall value.',g:'Multiply by 100.0 (not 100) so the division is not truncated.',x:[[`SELECT ROUND(100.0 * SUM(s.units) / (SELECT SUM(units) FROM sales), 1) AS pct_units ${SP} WHERE p.category = 'Shirt'`,'Shirts as a share of all units.']],m:'Rounding each part and expecting the shares to total exactly 100.',k:'Show each product category and its share of total revenue as pct (1 decimal), highest first.',s:`SELECT category, ROUND(100.0 * SUM(rev) / (SELECT SUM(s2.units * p2.price * (1 - s2.discount_pct / 100.0)) FROM sales s2 JOIN products p2 ON p2.id = s2.product_id), 1) AS pct FROM (SELECT p.category AS category, ${REV} AS rev ${SP}) t GROUP BY category ORDER BY pct DESC`,h:'Scalar subquery for the grand total'},
{t:'Analytics 7: ranking stores',e:'Ranking questions: aggregate, sort, then keep the top rows.',g:'State the question as: measure, grouped by, sorted by, how many.',x:[[`SELECT st.store, ROUND(SUM(${REV}),2) AS revenue ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.store ORDER BY revenue ASC LIMIT 2`,'Bottom two stores.']],m:'Forgetting that LIMIT needs ORDER BY.',k:'Show the top 3 stores by revenue: store and revenue (2 decimals).',s:`SELECT st.store, ROUND(SUM(${REV}),2) AS revenue ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.store ORDER BY revenue DESC LIMIT 3`,h:'GROUP BY store, ORDER BY revenue DESC LIMIT 3'}
];
var CAP=[
{t:'Challenge 1: top products',e:'Capstone challenges. No walkthroughs: only a short plan and a hint. Solve each from scratch.',g:'Plan: join, group by product, sort, limit.',k:'Show name, team and revenue (2 decimals) of the 3 best-selling products by revenue.',s:`SELECT p.name, p.team, ROUND(SUM(${REV}),2) AS revenue ${SP} GROUP BY p.name, p.team ORDER BY revenue DESC LIMIT 3`,h:'Group by p.name, p.team'},
{t:'Challenge 2: peak month',g:'Plan: bucket by month, total, sort, take one.',e:'Management wants to know when trade peaked.',k:'Which month had the highest revenue? Show ym and revenue (2 decimals).',s:`SELECT SUBSTRING(s.sale_date,1,7) AS ym, ROUND(SUM(${REV}),2) AS revenue ${SP} GROUP BY SUBSTRING(s.sale_date,1,7) ORDER BY revenue DESC LIMIT 1`,h:'ORDER BY revenue DESC LIMIT 1'},
{t:'Challenge 3: missed targets',g:'Plan: actuals per store and month, LEFT JOIN to targets, compare with COALESCE, count.',e:'Finance asks how often stores missed target.',k:'Count the store-months where actual revenue was below target (no sales counts as 0). Return as misses.',s:`SELECT COUNT(*) AS misses FROM targets t LEFT JOIN (SELECT s.store_id AS store_id, SUBSTRING(s.sale_date,1,7) AS period, SUM(${REV}) AS rev ${SP} GROUP BY s.store_id, SUBSTRING(s.sale_date,1,7)) a ON a.store_id = t.store_id AND a.period = t.period WHERE COALESCE(a.rev,0) < t.target`,h:'Join on both store_id and period'},
{t:'Challenge 4: discount by channel',g:'Plan: join stores, group by channel, average.',e:'Is online discounting more aggressive?',k:'Show each channel and its average discount_pct (1 decimal) as avg_disc.',s:`SELECT st.channel, ROUND(AVG(s.discount_pct),1) AS avg_disc ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.channel`,h:'AVG(s.discount_pct) by st.channel'},
{t:'Challenge 5: revenue per unit',g:'Plan: group by category, divide two sums.',e:'Which categories earn the most per unit sold?',k:'Show category and revenue per unit (2 decimals) as rev_per_unit, highest first.',s:`SELECT p.category, ROUND(SUM(${REV}) / SUM(s.units),2) AS rev_per_unit ${SP} GROUP BY p.category ORDER BY rev_per_unit DESC`,h:'SUM(revenue) / SUM(units)'},
{t:'Challenge 6: customer value',g:'Plan: customers LEFT JOIN orders and products, group, COALESCE, sort.',e:'Use the original customers, orders and products tables. Every customer must appear.',k:'Show each customer name, number of orders as orders_n, and total spend (qty x price) as revenue (0 if none), highest first.',s:'SELECT c.name, COUNT(o.id) AS orders_n, COALESCE(SUM(o.qty * p.price),0) AS revenue FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN products p ON p.id = o.product_id GROUP BY c.name ORDER BY revenue DESC',h:'Two LEFT JOINs and COALESCE(SUM(...),0)'},
{t:'Challenge 7: clean order list',g:'Plan: choose rows to keep (dedupe, valid amount), then clean each column.',e:'Use raw_orders. Produce the table an analyst could trust.',k:'Keep the lowest id per raw email, product, order_date combination and drop N/A amounts. Show id, email (trimmed, lower), product (trimmed, lower), amount (number) and iso_date (YYYY-MM-DD).',s:"SELECT id, LOWER(TRIM(email)) AS email, LOWER(TRIM(product)) AS product, CAST(amount AS NUMBER) AS amount, CASE WHEN SUBSTRING(order_date,3,1) = '/' THEN SUBSTRING(order_date,7,4) + '-' + SUBSTRING(order_date,4,2) + '-' + SUBSTRING(order_date,1,2) ELSE order_date END AS iso_date FROM raw_orders WHERE id IN (SELECT MIN(id) FROM raw_orders GROUP BY email, product, order_date) AND amount <> 'N/A'",h:'Combine lessons Cleanup 2, 4, 6 and 7'},
{t:'Challenge 8: online category winner',g:'Plan: join stores, filter channel, group by category, take the top.',e:'Where should the online team focus?',k:'Which product category earns the most revenue in online stores? Show category and revenue (2 decimals).',s:`SELECT p.category, ROUND(SUM(${REV}),2) AS revenue ${SP} JOIN stores st ON st.id = s.store_id WHERE st.channel = 'online' GROUP BY p.category ORDER BY revenue DESC LIMIT 1`,h:"WHERE st.channel = 'online'"},
{t:'Challenge 9: regional summary',g:'Plan: join stores, group by region, count distinct stores, divide.',e:'Build the one-line-per-region summary for the board.',k:'For each region show stores (count of stores), revenue (2 decimals) and per_store (revenue per store, 2 decimals), highest revenue first.',s:`SELECT st.region, COUNT(DISTINCT st.id) AS stores, ROUND(SUM(${REV}),2) AS revenue, ROUND(SUM(${REV}) / COUNT(DISTINCT st.id),2) AS per_store ${SP} JOIN stores st ON st.id = s.store_id GROUP BY st.region ORDER BY revenue DESC`,h:'COUNT(DISTINCT st.id) and SUM in the same SELECT'},
{t:'Final check: skills checklist',r:1,nr:1,e:'If you can solve the challenges, you can do this at work:<pre>Explore and profile a new table\nFilter, sort and limit\nSummarise with GROUP BY / HAVING\nJoin 3+ tables safely\nSpot and avoid join fan-out\nFind gaps with LEFT JOIN\nUse subqueries and CASE\nClean text, types, dates, duplicates\nCompare actual vs target\nBuild a board-ready summary</pre>',g:'Next: keep going with the Practice tab (all topics), then redo the challenges without hints. Then try the same queries on real data in Snowflake, adding window functions and CTEs.',m:'Trusting numbers you have not sanity-checked. Always compare totals against a known figure.'}
];
var KANTO=[
{t:'Pallet Town: your journey begins',a:'Pallet Town',e:'Every adventure starts with a look at what you have. <code>SELECT</code> picks columns, <code>FROM</code> picks the table. New tables: <code>species</code> (name, type1, type2, hp, catch_rate) and <code>encounters</code> (area, pokemon, min_lvl, max_lvl, rate).',biz:'Opening a product catalogue and choosing which attributes to look at.',g:'Peek with SELECT * and LIMIT, then choose only the columns you need.',x:[[`SELECT * FROM species LIMIT 5`,'First five species.']],k:'Show name and type1 for every species.',s:'SELECT name, type1 FROM species',h:'SELECT name, type1 FROM species'},
{t:'Route 1: filtering the grass',a:'Route 1',e:'<code>WHERE</code> keeps only matching rows. Text goes in quotes.',biz:'Filtering sales to one store and a threshold.',g:'Say the condition aloud, then write it.',x:[[`SELECT pokemon, rate FROM encounters WHERE area = 'Route 1'`,'Everything on Route 1.']],k:'Show pokemon and rate for Route 1 encounters that can appear at level 5 or higher (max_lvl >= 5).',s:`SELECT pokemon, rate FROM encounters WHERE area = 'Route 1' AND max_lvl >= 5`,h:'area = Route 1 AND max_lvl >= 5'},
{t:'Viridian City: ranking and the Poke Mart',a:'Viridian City',e:'<code>ORDER BY</code> sorts and <code>LIMIT</code> keeps the top rows.',biz:'Best sellers, cheapest items, top-N lists.',g:'Sort first, then cut. Add a second sort column to break ties.',x:[[`SELECT name, hp FROM species ORDER BY hp DESC LIMIT 3`,'Three sturdiest species.']],k:'Show name and catch_rate of the 3 easiest species to catch (highest catch_rate, ties by name).',s:'SELECT name, catch_rate FROM species ORDER BY catch_rate DESC, name LIMIT 3',h:'ORDER BY catch_rate DESC, name LIMIT 3'},
{t:'Route 2: lists and ranges',a:'Route 2',e:'<code>IN</code> matches a list, <code>BETWEEN</code> a range, <code>LIKE</code> a pattern.',biz:'Selecting a group of stores or a price band.',g:'IN replaces a chain of ORs.',x:[[`SELECT name FROM species WHERE name LIKE 'P%'`,'Names starting with P.']],k:'Show area and pokemon for encounters in Route 2 or Viridian Forest with a rate of at least 15.',s:`SELECT area, pokemon FROM encounters WHERE area IN ('Route 2','Viridian Forest') AND rate >= 15`,h:'area IN (...) AND rate >= 15'},
{t:'Viridian Forest: missing values',a:'Viridian Forest',e:'<code>NULL</code> means unknown. Use <code>IS NULL</code>. Many species have no second type.',biz:'Missing attributes in product master data, a daily headache for data teams.',g:'Never write = NULL.',x:[[`SELECT DISTINCT type1 FROM species`,'DISTINCT removes repeats.']],k:'Show the names of species with no second type and a catch_rate below 100, A to Z.',s:'SELECT name FROM species WHERE type2 IS NULL AND catch_rate < 100 ORDER BY name',h:'type2 IS NULL AND catch_rate < 100'},
{t:'Pewter City: counting and averages',a:'Pewter City',e:'<code>COUNT</code>, <code>AVG</code>, <code>MAX</code> summarise many rows into one.',biz:'Headline KPIs: number of products, average price.',g:'No GROUP BY means one summary row for the whole table.',x:[[`SELECT MAX(hp) AS top_hp FROM species`,'One aggregate.']],k:'Return the number of species as n and the average catch_rate (1 decimal) as avg_catch.',s:'SELECT COUNT(*) AS n, ROUND(AVG(catch_rate),1) AS avg_catch FROM species',h:'COUNT(*) and ROUND(AVG(...),1)'},
{t:'Route 3: group the trainers',a:'Route 3',e:'<code>GROUP BY</code> gives one summary row per group.',biz:'Sales per category, orders per region.',g:'Every SELECT column is either grouped or aggregated.',x:[[`SELECT area, COUNT(*) AS n FROM encounters GROUP BY area`,'Encounter slots per area.']],k:'Show each type1 and the number of species n, most first (ties by type1).',s:'SELECT type1, COUNT(*) AS n FROM species GROUP BY type1 ORDER BY n DESC, type1',h:'GROUP BY type1 ORDER BY n DESC, type1'},
{t:'Mt. Moon: filtering groups',a:'Mt. Moon',e:'<code>HAVING</code> filters groups after aggregation.',biz:'Only stores with more than N orders; only products selling in volume.',g:'WHERE filters rows, HAVING filters groups.',x:[[`SELECT area, SUM(rate) AS total FROM encounters GROUP BY area HAVING SUM(rate) <> 100`,'Areas whose rates do not total 100.']],k:'Which areas have more than 4 different Pokemon? Show area and n.',s:'SELECT area, COUNT(*) AS n FROM encounters GROUP BY area HAVING COUNT(*) > 4',h:'HAVING COUNT(*) > 4'},
{t:'Cerulean City: joining tables',a:'Cerulean City',e:'<code>JOIN ... ON</code> links tables by a shared key: encounters.pokemon matches species.name.',biz:'Joining sales lines to the product catalogue to get names and attributes.',g:'Alias the tables (encounters e, species s) and join on the key.',x:[[`SELECT e.area, e.pokemon, s.type1 FROM encounters e JOIN species s ON s.name = e.pokemon LIMIT 5`,'Encounters with types.']],k:'Show pokemon and type1 for every Mt. Moon encounter, highest rate first.',s:`SELECT e.pokemon, s.type1 FROM encounters e JOIN species s ON s.name = e.pokemon WHERE e.area = 'Mt. Moon' ORDER BY e.rate DESC`,h:'JOIN species s ON s.name = e.pokemon'},
{t:'Vermilion City: join and group',a:'Vermilion City',e:'Combine a join with GROUP BY to summarise attributes from the other table.',biz:'Average conversion rate per store.',g:'Join first, then group.',x:[[`SELECT s.type1, COUNT(*) AS sightings FROM encounters e JOIN species s ON s.name = e.pokemon GROUP BY s.type1`,'Sightings per type.']],k:'For each area show area and average catch_rate (1 decimal) as avg_catch, easiest first (ties by area).',s:'SELECT e.area, ROUND(AVG(s.catch_rate),1) AS avg_catch FROM encounters e JOIN species s ON s.name = e.pokemon GROUP BY e.area ORDER BY avg_catch DESC, e.area',h:'Join, GROUP BY e.area, AVG(s.catch_rate)'},
{t:'Lavender Town: the missing ones',a:'Lavender Town',e:'<code>LEFT JOIN</code> keeps all rows from the left table. Filter on NULL to find rows with no match.',biz:'Catalogue items that have never sold: dead stock.',g:'Start from the table that must keep every row.',x:[[`SELECT s.name, e.area FROM species s LEFT JOIN encounters e ON e.pokemon = s.name WHERE s.name IN ('Snorlax','Pikachu')`,'Snorlax has no area.']],k:'Which species never appear in any encounter? Names, A to Z.',s:'SELECT s.name FROM species s LEFT JOIN encounters e ON e.pokemon = s.name WHERE e.pokemon IS NULL ORDER BY s.name',h:'LEFT JOIN then WHERE e.pokemon IS NULL'},
{t:'Celadon City: tiers with CASE',a:'Celadon City',e:'<code>CASE WHEN</code> creates labels from conditions.',biz:'ABC analysis: tiering products into A, B, C classes.',g:'Conditions are checked top to bottom.',x:[[`SELECT name, CASE WHEN hp >= 100 THEN 'Big' ELSE 'Small' END AS size FROM species LIMIT 5`,'Simple two-way label.']],k:'Label each species by catch_rate: Easy if 190 or more, Medium if 100 or more, otherwise Rare. Show name and difficulty.',s:`SELECT name, CASE WHEN catch_rate >= 190 THEN 'Easy' WHEN catch_rate >= 100 THEN 'Medium' ELSE 'Rare' END AS difficulty FROM species`,h:'CASE WHEN ... WHEN ... ELSE ... END AS difficulty'},
{t:'Saffron City: above-average spotting',a:'Saffron City',e:'A subquery inside parentheses can supply a value such as an average.',biz:'Finding above-average performers: stores or lines beating the mean.',g:'Write the inner query alone first.',x:[[`SELECT AVG(rate) AS avg_rate FROM encounters`,'The inner query.']],k:'Show area, pokemon and rate for encounters with a rate above the average rate of all encounters, highest first (ties by area, pokemon).',s:'SELECT area, pokemon, rate FROM encounters WHERE rate > (SELECT AVG(rate) FROM encounters) ORDER BY rate DESC, area, pokemon',h:'rate > (SELECT AVG(rate) FROM encounters)'},

)}else{var g=RPG_GYMS[a.index];if(RPG_STATE.badges.indexOf(g.badge)<0)RPG_STATE.badges.push(g.badge);RPG_STATE.mastery[g.type]=(RPG_STATE.mastery[g.type]||0)+1;var fresh2=rpgRewardPokemon(g.reward);rpgAddXP(125);rpgSave();RPG_ACTIVE=null;var unlockedNow=rpgUnlocked();rpgPop(g.reward,g.badge+' earned!',g.leader+' defeated. '+(fresh2?'You also received '+g.reward+'. ':'')+(unlockedNow>Math.floor((RPG_STATE.badges.length-1)/2)?'A new region has opened! ':'')+'SQL topic mastered: '+g.type+'.');setTimeout(function(){setMode('quest')},500)}}}

 var n=nxt(),tot=Object.keys(done).length,unlocked=rpgUnlocked();var h='<section class="region-hero"><div class="eyebrow">POKEQUERY RPG · SQL ADVENTURE</div><h2>Become a SQL Champion</h2><p>Explore regions, encounter Pokémon, battle Gym Leaders and learn SQL by doing.</p><div class="journey-stats"><div class="journey-stat"><b>'+RPG_STATE.badges.length+'/12</b><span>Badges</span></div><div class="journey-stat"><b>'+G.caught.length+'/36</b><span>Pokémon</span></div><div class="journey-stat"><b>'+unlocked+'/6</b><span>Regions</span></div></div><div class="row"><button class="btn p" id="homeWild">🌿 Search for Pokémon</button><button class="btn" id="homeGym">🏟️ Next Gym</button></div></section>';
 h+='<div class="card"><h2>🎒 Trainer profile</h2><p>'+ttl()+' · Level '+lvl()+' · '+G.xp+' XP</p><p style="color:var(--mu);font-size:13px">'+tot+' of '+L.length+' lessons complete · '+ps+' practice questions solved</p><div class="row"><button class="btn p" id="goN">'+(n<0?'Review lessons':'📘 Continue training')+'</button><button class="btn" id="goP">⚡ Random practice</button><button class="btn" id="goQuest">🎮 RPG quest</button></div></div>';

var RPG_STYLE=document.createElement('style');RPG_STYLE.textContent=`.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:#ffdc58;text-transform:uppercase}.region-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.region-card{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #405765;background:linear-gradient(135deg,#203542,#172731);border-radius:15px;min-width:0}.region-locked{opacity:.5;filter:saturate(.45)}.region-icon{font-size:25px}.region-copy{flex:1;min-width:0}.region-copy b,.region-copy small{display:block}.region-copy small{font-size:11px;color:#a9bdc9;line-height:1.3;margin-top:3px}.region-status{font-size:9px;font-weight:900;color:#ffdf69;white-space:nowrap}.gym-row:disabled{opacity:.42;filter:saturate(.4)}.mastery-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mastery-tile{padding:12px;background:#11232d;border:1px solid #344b59;border-radius:13px}.mastery-tile span{float:right;color:#ffdc58}.mastery-tile b,.mastery-tile small{display:block}.mastery-tile small{color:#a9bdc9;font-size:11px;margin-top:4px}.dex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.dex-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:1px solid #3a5361;border-radius:12px;background:#12232d;text-align:center;min-width:0}.dex-card span{font-size:23px}.dex-card b{font-size:11px;overflow-wrap:anywhere}.dex-card small{font-size:9px;color:#a9bdc9}.dex-unknown{opacity:.5}.encounter-stage{display:flex;align-items:center;gap:14px;padding:16px;background:radial-gradient(ellipse at 30% 50%,#315f52,#12242c 75%);border:1px solid #42675e;border-radius:17px;margin:12px 0}.enc-ball,.capture-ball{width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:#f4f6f8;border:5px solid #e64b4b;box-shadow:inset 0 -20px #dfe7ed;font-size:29px;flex-shrink:0}.capture-start .capture-ball{animation:ballthrow .85s ease-in-out}.capture-su
